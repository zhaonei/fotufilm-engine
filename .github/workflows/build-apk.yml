name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 🌟 核心修复：系统提示需要 Dart 3.11.5，我们就用能提供它的最高稳定版 Flutter 3.47.9
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'

      # 🌟 核心修复：一键还原被破坏的配置文件，绝对不瞎改
      - name: Restore pubspec.yaml
        run: |
          echo "正在还原损坏的配置文件..."
          git checkout flutter/pubspec.yaml || true
          git checkout pubspec.yaml || true

      - name: Cache Toolchains & Halide
        id: cache-env
        uses: actions/cache@v4
        with:
          path: |
            swift-host
            android-ndk-r27d
            swift-sdks
            build/halide-host
          key: fotufilm-env-v12

      - name: Install Dependencies & LLVM 21
        if: steps.cache-env.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config git
          sudo apt-get install -y libedit-dev libz3-dev libffi-dev libncurses5-dev
          sudo apt-get install -y zlib1g-dev libzstd-dev liblz4-dev libbz2-dev liblzma-dev
          sudo apt-get install -y libjpeg-dev libpng-dev libtiff-dev libwebp-dev
          sudo apt-get install -y libxml2-dev libexpat1-dev libssl-dev libcurl4-openssl-dev
          sudo apt-get install -y libpython3-dev python3-dev swig automake autoconf libtool
          
          sudo mkdir -p /etc/apt/keyrings
          for i in {1..3}; do
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/llvm-snapshot.gpg && break || sleep 5
          done
          
          echo "deb [signed-by=/etc/apt/keyrings/llvm-snapshot.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          
          for i in {1..3}; do
            sudo apt-get update && break || sleep 5
          done
          
          sudo apt-get install -y llvm-21-dev clang-21 lld-21 libclang-21-dev liblld-21-dev
          
          sudo ln -sf /usr/bin/llvm-config-21 /usr/local/bin/llvm-config
          sudo ln -sf /usr/bin/clang-21 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-21 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/lld-21 /usr/local/bin/lld

      - name: Setup Swap
        if: steps.cache-env.outputs.cache-hit != 'true'
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Download Toolchains
        if: steps.cache-env.outputs.cache-hit != 'true'
        run: |
          wget https://download.swift.org/swift-6.3.3-release/ubuntu2204/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu22.04.tar.gz
          tar -xzf swift-6.3.3-RELEASE-ubuntu22.04.tar.gz
          mv swift-6.3.3-RELEASE-ubuntu22.04 swift-host
          wget https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip android-ndk-r27d-linux.zip
          wget https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz
          mkdir -p swift-sdks
          mv swift-6.3.3-RELEASE_android.artifactbundle.tar.gz swift-sdks/
          cd swift-sdks/
          tar -xzf swift-6.3.3-RELEASE_android.artifactbundle.tar.gz

      - name: Setup Swift SDK Path
        run: |
          mkdir -p $HOME/.swiftpm/swift-sdks
          cp -r ./swift-sdks/* $HOME/.swiftpm/swift-sdks/ 2>/dev/null || true

      - name: Build Halide via Official Script
        if: steps.cache-env.outputs.cache-hit != 'true'
        run: |
          echo "开始官方构建..."
          chmod +x tools/build-halide-linux.sh
          ./tools/build-halide-linux.sh
          
          echo "正在搜索 Halide.h..."
          HALIDE_HEADER_PATH=$(find $GITHUB_WORKSPACE -name "Halide.h" -type f | head -n 1)
          if [ -z "$HALIDE_HEADER_PATH" ]; then
            echo "❌ 依然找不到 Halide.h"
            exit 1
          fi
          HALIDE_INC_DIR=$(dirname "$HALIDE_HEADER_PATH")
          REAL_HALIDE_ROOT=$(dirname "$HALIDE_INC_DIR")
          mkdir -p build
          cp -r $REAL_HALIDE_ROOT build/halide-host

      - name: Build APK
        env:
          SWIFT_TOOLCHAIN: ${{ github.workspace }}/swift-host
          SWIFT_SDK: swift-6.3.3-RELEASE_android
          ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk-r27d
          HALIDE_ROOT: ${{ github.workspace }}/build/halide-host
          MAKEFLAGS: "-j1"
          CMAKE_BUILD_PARALLEL_LEVEL: "1"
        run: |
          chmod +x flutter/build-android.sh
          ./flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-APK
          path: build/flutter-host/Fotufilm.apk
