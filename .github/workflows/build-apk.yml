name: Build APK (Pure CPU Ultimate V4)
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'

      - name: Disable Impeller & Restore Configs
        run: |
          git checkout flutter/pubspec.yaml || true
          git checkout pubspec.yaml || true
          MANIFEST="flutter/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \        <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />' "$MANIFEST" || true
          fi
          MANIFEST2="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST2" ]; then
            sed -i '/<application/i \        <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />' "$MANIFEST2" || true
          fi

      - name: Cache Toolchains & Halide
        id: cache-env
        uses: actions/cache@v4
        with:
          path: |
            swift-host
            android-ndk-r27d
            swift-sdks
            build/halide-host
          key: fotufilm-env-v22 # 🌟 全新缓存，彻底告别之前的坏状态

      - name: Setup Swap
        if: steps.cache-env.outputs.cache-hit != 'true'
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install Dependencies & LLVM 21
        if: steps.cache-env.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config git
          sudo apt-get install -y libedit-dev libz3-dev libffi-dev libncurses5-dev
          sudo apt-get install -y zlib1g-dev libzstd-dev liblz4-dev libbz2-dev liblzma-dev
          sudo apt-get install -y libjpeg-dev libpng-dev libtiff-dev libwebp-dev
          sudo apt-get install -y libxml2-dev libexpat1-dev libssl-dev libcurl4-openssl-dev
          sudo apt-get install -y libpython3-dev python3-dev swig automake autoconf libtool
          
          sudo mkdir -p /etc/apt/keyrings
          for i in {1..5}; do
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/llvm-snapshot.gpg && break || sleep 5
          done
          
          echo "deb [signed-by=/etc/apt/keyrings/llvm-snapshot.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          
          for i in {1..5}; do
            sudo apt-get update && break || sleep 5
          done
          
          sudo apt-get install -y llvm-21-dev clang-21 lld-21 libclang-21-dev liblld-21-dev
          
          sudo ln -sf /usr/bin/llvm-config-21 /usr/local/bin/llvm-config
          sudo ln -sf /usr/bin/clang-21 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-21 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/lld-21 /usr/local/bin/lld

      - name: Download Toolchains
        if: steps.cache-env.outputs.cache-hit != 'true'
        run: |
          for i in {1..3}; do
            wget -c https://download.swift.org/swift-6.3.3-release/ubuntu2204/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu22.04.tar.gz && break || sleep 5
          done
          tar -xzf swift-6.3.3-RELEASE-ubuntu22.04.tar.gz
          mv swift-6.3.3-RELEASE-ubuntu22.04 swift-host
          
          for i in {1..3}; do
            wget -c https://dl.google.com/android/repository/android-ndk-r27d-linux.zip && break || sleep 5
          done
          unzip android-ndk-r27d-linux.zip
          
          for i in {1..3}; do
            wget -c https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz && break || sleep 5
          done
          mkdir -p swift-sdks
          mv swift-6.3.3-RELEASE_android.artifactbundle.tar.gz swift-sdks/
          cd swift-sdks/
          tar -xzf swift-6.3.3-RELEASE_android.artifactbundle.tar.gz

      - name: Setup Swift SDK Path
        run: |
          mkdir -p $HOME/.swiftpm/swift-sdks
          cp -r ./swift-sdks/* $HOME/.swiftpm/swift-sdks/ 2>/dev/null || true

      # 🌟 终极必杀：在编译前，强行把目标目录建好，并塞入所有头文件！
      - name: Build Halide (Pure CPU) & Pre-Inject Headers
        if: steps.cache-env.outputs.cache-hit != 'true'
        run: |
          # 1. 提前建好目标文件夹
          mkdir -p $GITHUB_WORKSPACE/build/halide-host/include
          
          # 2. 提前把源码里的头文件全拷进去，让它检查时绝对能找到
          HALIDE_SRC_RUNTIME="$GITHUB_WORKSPACE/third_party/Halide/src/runtime"
          if [ -d "$HALIDE_SRC_RUNTIME" ]; then
            find "$HALIDE_SRC_RUNTIME" -maxdepth 1 -name "*.h" -exec cp {} $GITHUB_WORKSPACE/build/halide-host/include/ \;
          fi
          
          # 3. 开始编译 Halide
          chmod +x tools/build-halide-linux.sh
          export TARGET_VULKAN=OFF
          export TARGET_OPENCL=OFF
          export TARGET_WEBASSEMBLY=OFF
          export Halide_WASM_BACKEND=OFF
          
          ./tools/build-halide-linux.sh
          
          # 4. 编译完再全盘兜底搜一次
          HALIDE_HEADER_PATH=$(find $GITHUB_WORKSPACE -name "Halide.h" -type f | head -n 1)
          if [ -n "$HALIDE_HEADER_PATH" ]; then
             HALIDE_INC_DIR=$(dirname "$HALIDE_HEADER_PATH")
             cp -r $HALIDE_INC_DIR/* $GITHUB_WORKSPACE/build/halide-host/include/
          fi
          
          # 5. 导出库路径
          HALIDE_LIB_PATH=$(find $GITHUB_WORKSPACE -name "libHalide.*" -type f | head -n 1)
          if [ -n "$HALIDE_LIB_PATH" ]; then
            HALIDE_LIB_DIR=$(dirname "$HALIDE_LIB_PATH")
            echo "LIBRARY_PATH=$HALIDE_LIB_DIR:$LIBRARY_PATH" >> $GITHUB_ENV
            echo "LD_LIBRARY_PATH=$HALIDE_LIB_DIR:$LD_LIBRARY_PATH" >> $GITHUB_ENV
            echo "CMAKE_PREFIX_PATH=$HALIDE_LIB_DIR:$CMAKE_PREFIX_PATH" >> $GITHUB_ENV
          fi

      - name: Force Include Native Libs
        run: |
          NATIVE_LIB=$(find flutter/build -name "libfotufilm.so" | head -n 1)
          if [ -n "$NATIVE_LIB" ]; then
             mkdir -p flutter/android/app/src/main/jniLibs/arm64-v8a/
             cp "$NATIVE_LIB" flutter/android/app/src/main/jniLibs/arm64-v8a/
          fi

      - name: Build APK
        env:
          SWIFT_TOOLCHAIN: ${{ github.workspace }}/swift-host
          SWIFT_SDK: swift-6.3.3-RELEASE_android
          ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk-r27d
          HALIDE_ROOT: ${{ github.workspace }}/build/halide-host
          MAKEFLAGS: "-j1"
          CMAKE_BUILD_PARALLEL_LEVEL: "1"
        run: |
          chmod +x flutter/build-android.sh
          ./flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-APK-CPU
          path: build/flutter-host/Fotufilm.apk
