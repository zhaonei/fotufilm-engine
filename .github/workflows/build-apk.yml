name: Build Fotufilm APK (real engine)

# Cross-compiles the engine on an Ubuntu x86-64 runner and packs the JNI shell with it.
#
# The chain, in the order the repository's own scripts expect it:
#   LLVM 21 → patched Halide → arm64 Vulkan AOT kernels
#   codecs + FFmpeg for arm64
#   Swift toolchain + Swift SDK for Android → tools/build-android-engine.sh
#   android-shell/build.sh → signed APK
#
# Versions below are the ones the scripts default to and the ones this workflow was written
# against: Swift 6.3.3 (tools/build-android-engine.sh:44), NDK r27c (the Swift SDK's
# setup-android-sdk.sh requires NDK 27+), LLVM 21 (tools/build-halide-linux.sh: 21 or newer).

on:
  workflow_dispatch:
  push:
    branches: [android-jni-shell]
    paths:
      # The editor itself. Leaving this out meant a commit that fixed the UI -- and only the UI --
      # pushed cleanly and started nothing: the run list kept showing the commit before it.
      - 'flutter/**'
      # prepare.sh reads these, so they change what ships in assets/generated.
      - 'web/src/generated/**'
      - 'web/src/material-symbols.json'
      - 'web/public/glyphs/**'
      - 'android-shell/**'
      - 'Sources/**'
      - 'tools/**'
      - 'Package.swift'
      - 'version.env'
      - '.github/workflows/build-apk.yml'

permissions:
  # Write is for publishing the release at the end; nothing else in this job writes.
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFT_VERSION: '6.3.3'
  SWIFT_TOOLCHAIN: /opt/swift/swift-6.3.3-RELEASE-ubuntu24.04
  SWIFT_SDK: swift-6.3.3-RELEASE_android
  ANDROID_NDK_HOME: /opt/android-ndk/android-ndk-r27c
  LLVM_ROOT: /usr/lib/llvm-21
  HALIDE_ROOT: ${{ github.workspace }}/build/halide-linux-install
  FOTUFILM_ANDROID_DEPS: ${{ github.workspace }}/build/android-deps
  FOTUFILM_ANDROID_KERNELS: ${{ github.workspace }}/build/halide-android-arm64
  ABI: arm64-v8a

jobs:
  apk:
    name: arm64 APK with the Swift/Halide engine
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout (with the Halide submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Free disk space
        # Halide + LLVM headers + codec sources + Swift SDK are several gigabytes.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/system-images \
                      /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install LLVM 21 and build dependencies
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" |
            sudo tee /etc/apt/sources.list.d/llvm-21.list > /dev/null
          sudo apt-get update
          # libedit-dev: Halide's REPL links it. Its absence is a warning, not the failure that
          # stopped the build, but a quiet warning is not worth keeping.
          sudo apt-get install -y --no-install-recommends \
            llvm-21-dev libclang-21-dev lld-21 liblld-21-dev \
            libvulkan-dev libxml2-dev libffi-dev zlib1g-dev libedit-dev \
            cmake ninja-build pkg-config curl xz-utils unzip python3 \
            libcurl4-openssl-dev libedit2 libsqlite3-0 libncurses-dev libz3-dev tzdata
          /usr/lib/llvm-21/bin/llvm-config --version
          /usr/lib/llvm-21/bin/llvm-config --components | tr ' ' '\n' | grep -x -E 'nvptx|nvptxcodegen' || \
            { echo "::error::LLVM 21 has no NVPTX, and tools/build-halide-linux.sh requires it"; exit 1; }
          # Where these packages actually put their CMake configs; the Halide step reads them.
          echo "--- LLVM/Clang CMake configs ---"
          find /usr/lib/llvm-21 /usr/lib/cmake -maxdepth 4 \
               \( -name 'LLVMConfig.cmake' -o -name 'ClangConfig.cmake' \) 2>/dev/null | sort || true
          test -n "$(find /usr/lib/llvm-21 /usr/lib/cmake -maxdepth 4 -name 'LLVMConfig.cmake' 2>/dev/null | head -1)" || \
            { echo "::error::no LLVMConfig.cmake; llvm-21-dev did not install"; exit 1; }

      - name: Cache the Swift toolchain
        id: cache-swift
        uses: actions/cache@v4
        with:
          path: /opt/swift
          key: swift-${{ env.SWIFT_VERSION }}-ubuntu24.04

      - name: Install the Swift toolchain
        if: steps.cache-swift.outputs.cache-hit != 'true'
        run: |
          url="https://download.swift.org/swift-${SWIFT_VERSION}-release/ubuntu2404/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-ubuntu24.04.tar.gz"
          curl -fsSL --retry 5 --retry-delay 5 -o /tmp/swift.tar.gz "$url"
          sudo mkdir -p /opt/swift
          sudo tar xzf /tmp/swift.tar.gz -C /opt/swift
          sudo chown -R "$USER" /opt/swift

      - name: Check the Swift toolchain
        run: |
          export PATH="$SWIFT_TOOLCHAIN/usr/bin:$PATH"
          swift --version
          test -x "$SWIFT_TOOLCHAIN/usr/bin/swiftc" || { echo "::error::swiftc missing at $SWIFT_TOOLCHAIN"; exit 1; }

      - name: Cache the Swift SDK for Android
        id: cache-swift-sdk
        uses: actions/cache@v4
        with:
          # v2: the v1 runs saved whatever the first attempt left behind.
          path: ~/.swiftpm/swift-sdks
          key: swift-sdk-${{ env.SWIFT_VERSION }}-android-v2

      - name: Install the Swift SDK for Android
        # swift sdk install decides for itself where the bundle lands, and on Swift 6.3 an
        # artifact bundle can end up under a name other than the archive's. So the archive is
        # unpacked here, the .artifactbundle directory is found rather than assumed, and it is
        # put where tools/build-android-engine.sh looks for it:
        #   ~/.swiftpm/swift-sdks/$SWIFT_SDK.artifactbundle/swift-android
        # swift sdk install then runs only to register the SDK, and may fail harmlessly.
        run: |
          export PATH="$SWIFT_TOOLCHAIN/usr/bin:$PATH"
          sdk_root="$HOME/.swiftpm/swift-sdks"
          bundle="$sdk_root/${SWIFT_SDK}.artifactbundle"
          mkdir -p "$sdk_root"
          echo "--- before ---"
          find "$sdk_root" -maxdepth 2 -mindepth 1 | head -20

          if [ ! -f "$bundle/swift-android/swift-sdk.json" ]; then
            url="https://download.swift.org/swift-${SWIFT_VERSION}-release/android-sdk/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE_android.artifactbundle.tar.gz"
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/swift-android.tar.gz "$url"

            # An error page with the right name would otherwise fail inside tar, far from the cause.
            size=$(stat -c%s /tmp/swift-android.tar.gz)
            echo "downloaded $size bytes from $url"
            [ "$size" -gt 200000000 ] || { echo "::error::expected ~318 MB, got $size bytes"; file /tmp/swift-android.tar.gz; exit 1; }
            gzip -t /tmp/swift-android.tar.gz || { echo "::error::the download is not a gzip archive"; exit 1; }

            echo "--- archive top level ---"
            tar tzf /tmp/swift-android.tar.gz | awk -F/ 'NF<=2' | sort -u | head -10

            unpacked=/tmp/swift-sdk-unpack
            chmod -R u+w "$unpacked" 2>/dev/null || true
            rm -rf "$unpacked"
            mkdir -p "$unpacked"
            tar xzf /tmp/swift-android.tar.gz -C "$unpacked"

            # The archive holds one .artifactbundle directory; find it instead of trusting a name.
            found=$(find "$unpacked" -maxdepth 2 -name '*.artifactbundle' -type d | head -1)
            rm -rf "$bundle"
            if [ -n "$found" ]; then
              echo "found bundle: $found"
              mv "$found" "$bundle"
            else
              # No wrapper directory: the variant sits at the archive root.
              echo "no .artifactbundle wrapper; using the archive root"
              mkdir -p "$bundle"
              cp -a "$unpacked/." "$bundle/"
            fi
            # A bundle that kept no wrapper may have nested the variant one level deeper.
            if [ ! -d "$bundle/swift-android" ]; then
              inner=$(find "$bundle" -maxdepth 2 -name 'swift-android' -type d | head -1)
              [ -n "$inner" ] && mv "$inner" "$bundle/swift-android"
            fi
          fi

          # Optional: let swiftpm know about it too. The build reads the path directly, so a
          # refusal here is not a failure.
          swift sdk install "$bundle" ||
            echo "::warning::swift sdk install declined the bundle; android-shell reads it from $bundle"

          test -f "$bundle/swift-android/swift-sdk.json" || {
            echo "::error::no Swift SDK for Android at $bundle"
            find "$sdk_root" -maxdepth 3 | head -30
            exit 1
          }
          echo "--- installed ---"
          find "$bundle/swift-android" -maxdepth 1 -mindepth 1 | sort
          swift sdk list || true

      - name: Cache the Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /opt/android-ndk
          key: ndk-r27c-linux

      - name: Install the Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 5 --retry-delay 5 -o /tmp/ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          sudo mkdir -p /opt/android-ndk
          sudo unzip -q /tmp/ndk.zip -d /opt/android-ndk
          sudo chown -R "$USER" /opt/android-ndk

      - name: Point the SDK's ndk folder at the cached NDK
        # app/build.gradle.kts pins ndkVersion 27.2.12479018. AGP looks for it under the SDK's
        # ndk/ directory and would download it again; the symlink gives it the copy already here.
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sudo mkdir -p "$sdk/ndk"
          sudo ln -sfn /opt/android-ndk/android-ndk-r27c "$sdk/ndk/27.2.12479018"
          ls -l "$sdk/ndk"
          head -3 "$sdk/ndk/27.2.12479018/source.properties"

      - name: Point the Swift SDK's sysroot at this NDK
        # tools/build-android-engine.sh does the same when the link is stale; done here so a
        # failure names the step, and so the NDK and the SDK agree before anything is compiled.
        run: |
          grep '^Pkg.Revision' "$ANDROID_NDK_HOME/source.properties"
          cd "$HOME/.swiftpm/swift-sdks/${SWIFT_SDK}.artifactbundle/swift-android"
          bash scripts/setup-android-sdk.sh
          test -f "swift-resources/usr/lib/swift-aarch64/android/aarch64/swiftrt.o" || {
            echo "::error::the Swift SDK has no arm64 swiftrt.o"
            pwd
            find . -maxdepth 1 -mindepth 1 -printf '%y %f\n'
            find swift-resources/usr/lib -maxdepth 1 -mindepth 1 -printf '%y %f\n' 2>/dev/null | head -20
            exit 1; }

      - name: Read the Halide pin
        id: halide-pin
        run: echo "sha=$(git ls-tree HEAD third_party/Halide | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Cache Halide
        id: cache-halide
        uses: actions/cache@v4
        with:
          path: build/halide-linux-install
          key: halide-${{ steps.halide-pin.outputs.sha }}-${{ hashFiles('tools/halide-vulkan-*.patch', 'tools/halide-runtime-prefix-map.patch') }}-llvm21

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true

      - name: Analyse the Dart sources before the expensive steps
        # A missing import in one Dart file used to surface only after the Halide kernels and the
        # engine had been built -- 38 minutes to learn that SelectableText lives in material.dart.
        # The analyser answers the same question in about a minute; warnings and infos do not fail
        # the job, only errors do.
        working-directory: flutter
        run: |
          # pipefail: without it the pipeline's status is tail's, and a failing analyser looked
          # like a passing step -- which is how a parse error survived to the compiler.
          set -o pipefail
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | tail -40

      - name: Build Halide with the Vulkan patches
        # Same preparation as tools/build-halide-linux.sh -- a shared clone of the pin and the
        # five Vulkan patches -- but cmake runs here. That script passes only
        # -DHalide_LLVM_ROOT, and Halide then derives where to look for a matching Clang from
        # whichever layout it found LLVM through: Debian-derived packages put LLVM's config at
        # /usr/lib/llvm-21/lib/cmake/llvm or /usr/lib/cmake/llvm-21 and Clang's at
        # .../lib/cmake/clang or /usr/lib/cmake/clang-21, so the derived hint misses half the
        # time and CMake falls back to the runner's clang 16/17/18, which EXACT 21 rejects.
        # Giving LLVM_DIR and Clang_DIR outright removes the guess: they are attributes of the
        # cache, not the environment, which is why exporting them would not have worked.
        if: steps.cache-halide.outputs.cache-hit != 'true'
        run: |
          SOURCE=build/halide-linux-src
          BUILD=build/halide-linux-build

          [ -f third_party/Halide/CMakeLists.txt ] || git submodule update --init third_party/Halide
          pin="$(git ls-tree HEAD third_party/Halide | awk '{print $3}')"
          echo "Halide pin: $pin"
          [ -d "$SOURCE/.git" ] || git clone --quiet --shared --no-checkout third_party/Halide "$SOURCE"
          git -C "$SOURCE" checkout --quiet --force --detach "$pin"
          git -C "$SOURCE" clean -fdxq
          for patch in halide-vulkan-strict-float halide-vulkan-bool-uniforms halide-vulkan-allocation-padding halide-vulkan-readback-staging halide-runtime-prefix-map; do
            git -C "$SOURCE" apply "$PWD/tools/$patch.patch"
          done

          find_config() { find /usr/lib/llvm-21 /usr/lib/cmake -maxdepth 4 -name "$1" 2>/dev/null | head -1; }
          llvm_config_cmake="$(find_config LLVMConfig.cmake)"
          clang_config_cmake="$(find_config ClangConfig.cmake)"
          if [ -z "$clang_config_cmake" ]; then
            # Belt and braces: some packagings keep Clang's CMake config with the compiler.
            echo "no ClangConfig.cmake found; installing clang-21 and looking again"
            sudo apt-get install -y --no-install-recommends clang-21
            clang_config_cmake="$(find_config ClangConfig.cmake)"
          fi
          [ -n "$llvm_config_cmake" ] || {
            echo "::error::no LLVMConfig.cmake"
            find /usr/lib -maxdepth 4 -name 'LLVMConfig.cmake' || true
            exit 1
          }
          [ -n "$clang_config_cmake" ] || {
            echo "::error::no ClangConfig.cmake anywhere searched"
            dpkg -L libclang-21-dev | grep -i cmake | head -20 || true
            exit 1
          }
          llvm_dir="$(dirname "$llvm_config_cmake")"
          clang_dir="$(dirname "$clang_config_cmake")"
          echo "LLVM_DIR=$llvm_dir"
          echo "Clang_DIR=$clang_dir"

          cmake -G Ninja -S "$SOURCE" -B "$BUILD" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DHalide_LLVM_ROOT=/usr/lib/llvm-21 \
            -DLLVM_DIR="$llvm_dir" \
            -DClang_DIR="$clang_dir" \
            -DHalide_WASM_BACKEND=OFF \
            -DWITH_TESTS=OFF -DWITH_TUTORIALS=OFF -DWITH_DOCS=OFF \
            -DWITH_UTILS=OFF -DWITH_PYTHON_BINDINGS=OFF -DWITH_SERIALIZATION=OFF

          # CUDA kernels need LLVM's NVPTX backend, which Halide treats as optional and drops
          # quietly; the same guard the repository's script applies.
          grep -q 'found components:.*NVPTX' "$BUILD/CMakeCache.txt" || {
            echo "::error::this LLVM has no NVPTX component; the CUDA kernels cannot be generated"
            grep 'found components' "$BUILD/CMakeCache.txt" || true
            exit 1
          }
          cmake --build "$BUILD" --parallel "$(nproc)"
          cmake --install "$BUILD" --prefix "$HALIDE_ROOT" > /dev/null
          test -f "$HALIDE_ROOT/include/Halide.h" || { echo "::error::Halide was not installed"; exit 1; }

      - name: Generate the arm64 Vulkan AOT kernels
        run: |
          HALIDE_ROOT="$HALIDE_ROOT" tools/generate-halide-aot-android.sh "$FOTUFILM_ANDROID_KERNELS"
          find "$FOTUFILM_ANDROID_KERNELS" -maxdepth 1 -name '*.a' | sort | head

      - name: Cache the arm64 codecs and FFmpeg
        id: cache-codecs
        uses: actions/cache@v4
        with:
          path: build/android-deps
          key: codecs-${{ hashFiles('tools/build-android-codecs.sh') }}-ndk-r27c

      - name: Build the arm64 codecs and FFmpeg
        if: steps.cache-codecs.outputs.cache-hit != 'true'
        run: |
          ANDROID_NDK_HOME="$ANDROID_NDK_HOME" FOTUFILM_ANDROID_DEPS="$FOTUFILM_ANDROID_DEPS" \
            tools/build-android-codecs.sh
          test -f "$FOTUFILM_ANDROID_DEPS/arm64/lib/libjpeg.a" || { echo "::error::codecs missing"; exit 1; }

      - name: Build libfotufilm.so (Swift engine + Halide kernels + codecs)
        run: |
          ANDROID_NDK_HOME="$ANDROID_NDK_HOME" \
          SWIFT_TOOLCHAIN="$SWIFT_TOOLCHAIN" \
          SWIFT_SDK="$SWIFT_SDK" \
          HALIDE_ROOT="$HALIDE_ROOT" \
          FOTUFILM_ANDROID_DEPS="$FOTUFILM_ANDROID_DEPS" \
          FOTUFILM_ANDROID_KERNELS="$FOTUFILM_ANDROID_KERNELS" \
            tools/build-android-engine.sh
          engine=flutter/build/android-engine/jniLibs/$ABI
          test -f "$engine/libfotufilm.so" || { echo "::error::no libfotufilm.so"; exit 1; }
          file "$engine/libfotufilm.so"
          echo "--- libraries riding with the engine ---"
          find "$engine" -maxdepth 1 -type f -printf '%10s  %f\n' | sort -k2
          du -sh "$engine"

      - name: Check no tr() sits in a const expression
        # Dart rejects a method call inside a const expression and reports one line per build;
        # this finds every instance in a second, before the Flutter build spends minutes on it.
        # It is the check that would have caught `const FieldLabel(tr('Name'))` on the first run.
        run: python3 android-shell/tools/check-l10n-const.py flutter/lib

      - name: Check the Android host's Kotlin references resolve
        # A dangling `ExportFiles(this, messenger)` in MainActivity cost a whole pipeline run: the
        # engine and Halide were built first, and only then did :app:compileReleaseKotlin fail.
        # This finds that class of mistake in a second, before anything expensive starts.
        run: python3 android-shell/tools/check-kotlin-refs.py

      - name: Set up Node.js
        # flutter/tool/prepare.sh reads the editor's control catalogue through node.
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Gradle's dependencies and wrapper
        # flutter build drives the project's own Gradle wrapper: without this every run downloads
        # the distribution and resolves AGP's dependencies again.
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('flutter/android/gradle/wrapper/gradle-wrapper.properties', 'flutter/android/app/build.gradle.kts') }}

      - name: Accept the SDK licences
        # The Flutter Gradle plugin picks the platform/build-tools/NDK versions it wants; accepting
        # the licences lets AGP fetch the ones this runner lacks instead of failing at configure.
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          manager="$(find "$sdk/cmdline-tools" -maxdepth 2 -name sdkmanager 2>/dev/null | head -1)"
          [ -n "$manager" ] || { echo "::warning::no sdkmanager; relying on what the image has"; exit 0; }
          yes | "$manager" --licenses > /dev/null 2>&1 || true

      - name: Build the Flutter app and pack the engine into it
        # flutter/build-android.sh is the repository's own path: it rebuilds the engine through
        # tools/build-android-engine.sh (kernels and codecs are cached, so this is the compile and
        # link), stages the editor's generated assets, and hands the engine to Gradle through
        # FOTUFILM_ANDROID_ENGINE -- which app/build.gradle.kts turns into
        # sourceSets["main"].jniLibs, the supported way in. Copying files into
        # android/app/src/main/jniLibs instead would declare the same lib/arm64-v8a/libfotufilm.so
        # twice.
        env:
          FLUTTER: flutter
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          SWIFT_TOOLCHAIN: ${{ env.SWIFT_TOOLCHAIN }}
          SWIFT_SDK: ${{ env.SWIFT_SDK }}
          HALIDE_ROOT: ${{ env.HALIDE_ROOT }}
          FOTUFILM_ANDROID_DEPS: ${{ env.FOTUFILM_ANDROID_DEPS }}
          FOTUFILM_ANDROID_KERNELS: ${{ env.FOTUFILM_ANDROID_KERNELS }}
          # The keystore in the tree, so every build carries the same certificate and a download
          # installs over the previous one. See android-shell/keystore.
          FOTUFILM_ANDROID_KEYSTORE: ${{ github.workspace }}/android-shell/keystore/fotufilm-shell.jks
          FOTUFILM_ANDROID_KEYSTORE_PASSWORD: fotufilm
          FOTUFILM_ANDROID_KEY_ALIAS: fotufilm
          FOTUFILM_ANDROID_KEY_PASSWORD: fotufilm
        run: |
          export PATH="$SWIFT_TOOLCHAIN/usr/bin:$PATH"
          echo "flutter: $(flutter --version | head -1)"
          echo "engine libraries: $(find flutter/build/android-engine/jniLibs/arm64-v8a -name '*.so' | wc -l)"
          ./flutter/build-android.sh
          ls -lh build/flutter-host/Fotufilm.apk

      - name: Check the APK an installer will read
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT="$(find "$sdk/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          apk=build/flutter-host/Fotufilm.apk
          JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"

          "$BT/aapt2" dump badging "$apk" | head -8
          "$BT/aapt2" dump badging "$apk" | grep -q "native-code: 'arm64-v8a'" ||
            { echo "::error::the APK declares no arm64-v8a native code"; exit 1; }
          unzip -l "$apk" | grep -q 'resources.arsc' ||
            { echo "::error::the APK carries no resources.arsc"; exit 1; }

          # The editor reads these before it draws anything (flutter/lib/main.dart). A bundle
          # without them used to start to a black screen with nothing on it: the loads ran before
          # runApp, so a missing asset meant no widget tree at all. pubspec lists the directory
          # now; this makes sure a change there cannot go unnoticed again.
          for asset in assets/generated/controls.json assets/generated/material-symbols.json; do
            unzip -l "$apk" | grep -q "flutter_assets/$asset" ||
              { echo "::error::the APK has no $asset; the editor would start to a black screen"; exit 1; }
          done
          glyphs=$(unzip -l "$apk" | grep -c 'flutter_assets/assets/generated/glyphs/' || true)
          echo "$glyphs glyphs in the bundle"
          [ "${glyphs:-0}" -gt 0 ] || { echo "::error::the APK carries no glyphs"; exit 1; }
          fonts=$(unzip -l "$apk" | grep -c 'flutter_assets/assets/generated/fonts/' || true)
          echo "$fonts font files in the bundle"

          rm -rf /tmp/apkso && mkdir -p /tmp/apkso
          unzip -o -q "$apk" 'lib/arm64-v8a/*.so' -d /tmp/apkso
          libs=/tmp/apkso/lib/arm64-v8a
          echo "--- libraries in the APK ---"
          find "$libs" -maxdepth 1 -type f -printf '%10s  %f\n' | sort -k2
          test -f "$libs/libfotufilm.so" || { echo "::error::the APK carries no libfotufilm.so"; exit 1; }

          # What Flutter actually resolves: every symbol the Dart side looks up has to be exported
          # by the library that ships inside the APK. This is the alignment that matters -- the app
          # speaks dart:ffi to fotufilm.h, not JNI.
          grep -oE "'fotufilm_[a-z_]+'" flutter/lib/engine/fotufilm_ffi.dart | tr -d "'" | sort -u > /tmp/wanted.txt
          readelf -sW "$libs/libfotufilm.so" | awk '$5 == "GLOBAL" && $7 != "UND" {print $8}' | sort -u > /tmp/exported.txt
          missing=0
          while read -r symbol; do
            grep -qx "$symbol" /tmp/exported.txt ||
              { echo "::error::the engine does not export $symbol, which Flutter looks up"; missing=1; }
          done < /tmp/wanted.txt
          [ "$missing" = 0 ] || exit 1
          echo "all $(wc -l < /tmp/wanted.txt) fotufilm_* symbols Flutter asks for are exported"

          # Every DT_NEEDED of the engine has to ride beside it, or the loader stops at the first
          # miss: the Swift runtime and FFmpeg are in that list.
          missing=0
          for needed in $(readelf -d "$libs/libfotufilm.so" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p'); do
            case "$needed" in libc.so|libdl.so|libm.so|liblog.so|libz.so|libandroid.so) continue ;; esac
            if [ ! -f "$libs/$needed" ]; then echo "::error::missing $needed beside libfotufilm.so"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1

          # v1 (JAR) signature files are what an OEM installer reads its "developer certificate"
          # from; AGP leaves them out unless enableV1Signing is set.
          for entry in 'META-INF/.*\.SF' 'META-INF/.*\.RSA'; do
            unzip -l "$apk" | grep -qE "$entry" ||
              { echo "::error::the APK has no $entry; v1 signing is missing"; exit 1; }
          done
          # --min-sdk-version decides which scheme the verifier may use: 18 can only use v1, 24 v2,
          # 28 v3, so the three together prove the file carries all of them.
          for floor in 18 24 28; do
            echo "--- apksigner verify, min-sdk $floor ---"
            "$JAVA_HOME/bin/java" -jar "$BT/lib/apksigner.jar" verify --min-sdk-version "$floor" \
              --verbose "$apk" | grep -E 'Verifies|scheme \('
          done
          "$JAVA_HOME/bin/java" -jar "$BT/lib/apksigner.jar" verify --min-sdk-version 18 \
            --verbose "$apk" > /tmp/apkverify.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' /tmp/apkverify.txt ||
            { echo "::error::v1 (JAR) signature does not verify; VIVO reads the certificate from it"; exit 1; }
          "$JAVA_HOME/bin/java" -jar "$BT/lib/apksigner.jar" verify --min-sdk-version 18 \
            --print-certs "$apk" | head -3
          ls -lh "$apk"

      - name: Diagnostics on failure
        if: failure()
        run: |
          df -h /
          echo "--- swift sdk dir ---"
          find "$HOME/.swiftpm/swift-sdks" -maxdepth 3 2>/dev/null | head -40
          echo "--- build dir ---"
          find build -maxdepth 2 -type d 2>/dev/null | head -20
          echo "--- installed bundles ---"
          ls -lh /tmp/swift-android.tar.gz /tmp/ndk.zip /tmp/swift.tar.gz 2>/dev/null || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### Fotufilm arm64 APK"
            echo
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| commit | \`$GITHUB_SHA\` |"
            echo "| engine libraries | $(find "flutter/build/android-engine/jniLibs/$ABI" -maxdepth 1 -type f 2>/dev/null | wc -l) |"
            echo "| APK size | $(du -h build/flutter-host/Fotufilm.apk 2>/dev/null | cut -f1) |"
            echo "| libfotufilm.so | $(du -h "flutter/build/android-engine/jniLibs/$ABI/libfotufilm.so" 2>/dev/null | cut -f1) |"
            echo "| localized call sites | $(grep -ro 'tr(' flutter/lib --include='*.dart' | wc -l) |"
            echo "| vocabulary entries | $(grep -c '^  ' flutter/lib/l10n/zh.dart) |"
            echo
            echo '```'
            find "flutter/build/android-engine/jniLibs/$ABI" -maxdepth 1 -type f -printf '%10s  %f\n' | sort -k2 2>/dev/null || echo "no engine libraries"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checksum the APK
        run: |
          cd build/flutter-host
          sha256sum Fotufilm.apk | tee Fotufilm.apk.sha256

      - name: Upload the APK
        # compression-level 0 stores the entries instead of deflating them: a phone's unzip
        # library that misreads GitHub's deflate streams has nothing to misread, and the APK is
        # already compressed internally by the aapt2/d8 pipeline anyway.
        uses: actions/upload-artifact@v4
        with:
          name: fotufilm-apk-arm64
          path: |
            build/flutter-host/Fotufilm.apk
            build/flutter-host/Fotufilm.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload the engine libraries
        uses: actions/upload-artifact@v4
        with:
          name: fotufilm-engine-arm64
          path: flutter/build/android-engine/jniLibs/arm64-v8a/
          if-no-files-found: error
          retention-days: 14

      # Release assets are raw files, unlike the artifact above, which is a zip around the APK.
      # Downloading the .apk from Releases therefore skips the phone-side unzip step entirely.
      #
      # v1.0.0 is a fixed tag, so a second run finds the release already there. The two assets are
      # removed first: the upload rejects a name that already exists.
      - name: Drop the release assets a previous run left behind
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v gh > /dev/null || { echo "gh not installed; skipping"; exit 0; }
          if gh release view v1.0.0 > /dev/null 2>&1; then
            # Both the current names and the ones earlier runs published under.
            for name in Fotufilm.apk Fotufilm.apk.sha256 FotufilmShell.apk FotufilmShell.apk.sha256; do
              gh release delete-asset v1.0.0 "$name" --yes || true
            done
          fi

      - name: Publish the APK as a release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Fotufilm shell v1.0.0
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            The Flutter editor with `libfotufilm.so` (arm64: Swift engine, Halide AOT kernels,
            codecs and FFmpeg) built by `flutter/build-android.sh`.

            * `Fotufilm.apk` -- the editor, install directly (`adb install -r Fotufilm.apk`)
            * `Fotufilm.apk.sha256` -- `sha256sum -c` it to check the download

            Signed with the keystore committed in `android-shell/keystore`, so each build installs
            over the last. Android will ask you to allow installs from unknown sources.
          files: |
            build/flutter-host/Fotufilm.apk
            build/flutter-host/Fotufilm.apk.sha256
