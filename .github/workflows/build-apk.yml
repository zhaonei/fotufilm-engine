name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config git
          sudo apt-get install -y llvm-17-dev libclang-17-dev lld-17 liblld-17-dev clang-17
          sudo apt-get install -y libedit-dev libz3-dev libffi-dev libncurses5-dev
          sudo apt-get install -y zlib1g-dev libzstd-dev liblz4-dev libbz2-dev liblzma-dev
          sudo apt-get install -y libjpeg-dev libpng-dev libtiff-dev libwebp-dev
          sudo apt-get install -y libxml2-dev libexpat1-dev libssl-dev libcurl4-openssl-dev
          sudo apt-get install -y libpython3-dev python3-dev swig automake autoconf libtool
      - name: Setup Swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
      - name: Download Toolchains
        run: |
          wget https://download.swift.org/swift-6.3.3-release/ubuntu2204/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu22.04.tar.gz
          tar -xzf swift-6.3.3-RELEASE-ubuntu22.04.tar.gz
          mv swift-6.3.3-RELEASE-ubuntu22.04 swift-host
          wget https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip android-ndk-r27d-linux.zip
          wget https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz
          mkdir -p $HOME/.swiftpm/swift-sdks
          mv swift-6.3.3-RELEASE_android.artifactbundle.tar.gz $HOME/.swiftpm/swift-sdks/
          cd $HOME/.swiftpm/swift-sdks/
          tar -xzf swift-6.3.3-RELEASE_android.artifactbundle.tar.gz
      - name: Build Halide
        run: |
          wget https://github.com/halide/Halide/archive/refs/tags/v17.0.1.tar.gz
          tar -xzf v17.0.1.tar.gz
          cd Halide-17.0.1
          rm -rf python_bindings
          mkdir build-host
          cd build-host
          cmake .. -G Ninja -DLLVM_DIR=$(llvm-config-17 --cmakedir) -DClang_DIR="/usr/lib/llvm-17/lib/cmake/clang" -DLLD_DIR="/usr/lib/llvm-17/lib/cmake/lld" -DHalide_SHARED_LLVM=YES -DTARGET_WEBASSEMBLY=OFF -DTARGET_CUDA=OFF -DTARGET_OPENCL=OFF -DTARGET_VULKAN=ON -DWITH_TESTS=OFF -DWITH_TUTORIALS=OFF -DWITH_PYTHON_BINDINGS=OFF -DWITH_DOCS=OFF -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/build/halide-host"
          ninja
          ninja install
      - name: Apply Patches and Fix Code
        run: |
          echo "应用官方补丁并修复源码..."
          cd tools
          if [ -f "halide-vulkan-allocation-padding.patch" ]; then git apply halide-vulkan-allocation-padding.patch || true; fi
          if [ -f "halide-vulkan-strict-float.patch" ]; then git apply halide-vulkan-strict-float.patch || true; fi
          cd ..
          
          python3 - <<'PYTHON'
          import os, re
          for root, dirs, files in os.walk("Sources/FotufilmHalide"):
              for file in files:
                  if file.endswith((".cpp", ".h", ".hpp")):
                      path = os.path.join(root, file)
                      with open(path, "r", encoding="utf-8") as f: content = f.read()
                      if "srg_encoded_values" in content:
                          new_content = re.sub(r"srg_encoded_values\((?!clamp)(.*?)\)", r"srg_encoded_values(clamp(\1, 0, 1023))", content)
                          if new_content != content:
                              with open(path, "w", encoding="utf-8") as f: f.write(new_content)
                              print(f"✅ 已为 {path} 注入 Clamp 边界约束")
          PYTHON
          
      - name: Build APK
        env:
          SWIFT_TOOLCHAIN: ${{ github.workspace }}/swift-host
          SWIFT_SDK: swift-6.3.3-RELEASE_android
          ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk-r27d
          HALIDE_ROOT: ${{ github.workspace }}/build/halide-host
          MAKEFLAGS: "-j1"
          CMAKE_BUILD_PARALLEL_LEVEL: "1"
          # 核心修复：强制底层构建脚本使用正确的 Android 配置
          CMAKE_C_FLAGS: "-DWITH_LIBDE265=ON -DWITH_AOM_DECODER=OFF -DWITH_AOM_DECODER_PLUGIN=OFF -DWITH_X265=OFF -DWITH_DAV1D=OFF -DENABLE_PLUGIN_LOADING=OFF -DENABLE_EXAMPLES=OFF -DBUILD_TESTING=OFF"
          CMAKE_CXX_FLAGS: "-DWITH_LIBDE265=ON -DWITH_AOM_DECODER=OFF -DWITH_AOM_DECODER_PLUGIN=OFF -DWITH_X265=OFF -DWITH_DAV1D=OFF -DENABLE_PLUGIN_LOADING=OFF -DENABLE_EXAMPLES=OFF -DBUILD_TESTING=OFF"
        run: |
          chmod +x flutter/build-android.sh
          ./flutter/build-android.sh
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-APK
          path: build/flutter-host/Fotufilm.apk
