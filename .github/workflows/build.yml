name: Build Optimized Fotufilm

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Inject Memory Reclaim & Build
        run: |
          # [AI 补丁] 强行注入显存强制回收代码到 JS 引擎中
          echo "Injecting GPU memory reclaim..."
          find web/ -name "*.js" -exec sed -i '1i function forceDestroyGPUResources() { if(globalThis.__bufs){ for(const b of globalThis.__bufs){try{b.destroy()}catch(e){}} } globalThis.__bufs=[]; } window.addEventListener("beforeunload", forceDestroyGPUResources);' {} \;
          
          cd flutter
          flutter build web --wasm --release
          
          # 把资源文件也复制进去
          if [ -d ../web ]; then cp -rn ../web/* build/web/ || true; fi
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fotufilm-optimized
          path: flutter/build/web/
