name: Build Fotufilm Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Swift Android Toolchain
        uses: skiptools/swift-android-action@v2
        with:
          android-api-level: 28
          # 官方支持通过 swift-version 来指定匹配的工具链
          swift-version: '6.3' 
          run-tests: false
          build-tests: false
        continue-on-error: true

      - name: Download Android NDK
        if: always()
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

      - name: Install Halide via APT
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y libhalide17-1-dev
          echo "HALIDE_ROOT=/usr" >> $GITHUB_ENV

      - name: Build Android APK
        if: always()
        run: |
          # 打印环境信息，方便排查
          echo "--- Swift Toolchain Info ---"
          which swift
          swift --version
          echo "--- SDKROOT ---"
          echo $SDKROOT
          
          # 运行构建脚本
          chmod +x flutter/build-android.sh
          ./flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Android-APK
          path: build/flutter-host/Fotufilm.apk
