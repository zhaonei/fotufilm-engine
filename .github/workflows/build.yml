name: Build Fotufilm Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Swift Android Toolchain
        uses: skiptools/swift-android-action@v2
        with:
          android-api-level: 28
          swift-version: '6.3'
          run-tests: false
          build-tests: false
        continue-on-error: true

      - name: Download Android NDK
        if: always()
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

      - name: Install Halide via APT
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y libhalide17-1-dev
          echo "HALIDE_ROOT=/usr" >> $GITHUB_ENV

      - name: Build Android APK
        if: always()
        run: |
          # 🌟 终极修复：把正确的 Swift 工具链路径强行插到系统 PATH 的最前面
          SWIFT_TOOLCHAIN_DIR="/home/runner/.config/swiftpm/toolchains/swift-android/usr"
          if [ -d "$SWIFT_TOOLCHAIN_DIR" ]; then
            echo "✅ 找到 Swift 工具链，正在覆盖环境变量..."
            export SWIFT_TOOLCHAIN="$SWIFT_TOOLCHAIN_DIR"
            export PATH="$SWIFT_TOOLCHAIN_DIR/bin:$PATH"
            export SDKROOT="$SWIFT_TOOLCHAIN_DIR"
          else
            echo "⚠️ 未找到默认路径，尝试全局搜索..."
            SWIFT_TOOLCHAIN_DIR=$(find /home/runner/.config/swiftpm/toolchains -name "swift-android" -type d | head -n 1)/usr
            export SWIFT_TOOLCHAIN="$SWIFT_TOOLCHAIN_DIR"
            export PATH="$SWIFT_TOOLCHAIN_DIR/bin:$PATH"
            export SDKROOT="$SWIFT_TOOLCHAIN_DIR"
          fi
          
          echo "当前调用的 Swift 版本："
          which swift
          swift --version

          chmod +x flutter/build-android.sh
          ./flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Android-APK
          path: build/flutter-host/Fotufilm.apk
