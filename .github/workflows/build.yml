name: Build Fotufilm Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Swift Android Toolchain
        uses: skiptools/swift-android-action@v2
        with:
          android-api-level: 28
          swift-version: '6.3'
          run-tests: false
          build-tests: false
        continue-on-error: true # 允许 Swift 测试工具链报错而不中断

      - name: Download Android NDK
        if: always() # 强行继续
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

      - name: Download Halide
        if: always() # 强行继续
        run: |
          # 修复：替换为官方标准下载链接
          wget https://github.com/halide/Halide/releases/download/v17.0.1/Halide-17.0.1-x86-64-linux.tar.gz
          tar -xzf Halide-17.0.1-x86-64-linux.tar.gz
          mv Halide-17.0.1-x86-64-linux Halide
          echo "HALIDE_ROOT=$GITHUB_WORKSPACE/Halide" >> $GITHUB_ENV

      - name: Build Android APK
        if: always() # 强行继续
        run: |
          chmod +x flutter/build-android.sh
          ./flutter/build-android.sh

      - name: Upload APK
        if: always() # 强行继续
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Android-APK
          path: build/flutter-host/Fotufilm.apk
