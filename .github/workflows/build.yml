name: Build Fotufilm Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Swift Android Toolchain
        uses: skiptools/swift-android-action@v2
        with:
          android-api-level: 28
          swift-version: '6.3'
          run-tests: false
          build-tests: false
        continue-on-error: true

      - name: Download Android NDK
        if: always()
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

      - name: Install Halide via APT
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y libhalide17-1-dev
          echo "HALIDE_ROOT=/usr" >> $GITHUB_ENV

      - name: Build Android APK
        if: always()
        run: |
          # 🌟 核心修复：获取 Swift 路径，强行赋给 SWIFT_TOOLCHAIN
          SWIFT_PATH=$(which swift)
          echo "Current Swift path is: $SWIFT_PATH"
          export SWIFT_TOOLCHAIN=$(dirname $(dirname $SWIFT_PATH))
          echo "Force set SWIFT_TOOLCHAIN to: $SWIFT_TOOLCHAIN"
          
          # 运行构建
          chmod +x flutter/build-android.sh
          ./flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Android-APK
          path: build/flutter-host/Fotufilm.apk
