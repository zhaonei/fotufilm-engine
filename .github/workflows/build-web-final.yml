name: Build 100% Offline Fotufilm APK (Bulletproof Edition V3)
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer & Prepare Real Samples
        shell: bash
        run: |
          npm init -y
          npm install puppeteer
          
          echo "正在下载真实测试样片..."
          wget -q --tries=3 --timeout=15 -O sample.cr2 "https://raw.pixls.us/getfile.php/1425/nice/Canon%20-%20EOS%205D%20Mark%20III%20-%2012bit%20%283%3A2%29.CR2" || \
          wget -q --tries=3 --timeout=15 -O sample.cr2 "https://github.com/letmaik/rawpy-test-data/raw/master/RAW_CANON_40D_SRAW_V103.CR2"
          
          wget -q --tries=3 --timeout=15 -O sample.tiff "https://github.com/python-pillow/Pillow/raw/main/Tests/images/hopper.tif" || \
          wget -q --tries=3 --timeout=15 -O sample.tiff "https://filesamples.com/samples/image/tiff/sample_640%C3%97426.tiff"
          
          ls -lh sample.cr2 sample.tiff

      - name: Run Exhaustive Asset Extractor
        run: |
          cat << 'EOF' > extract.js
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          const path = require('path');

          (async () => {
              const baseUrl = 'https://fotufilm.com/demo/';
              const baseDir = './web';
              let activeRequests = 0;

              console.log('🚀 启动全量资源抓取引擎...');
              const browser = await puppeteer.launch({ 
                  args: ['--no-sandbox', '--disable-setuid-sandbox'],
                  headless: "new" 
              });
              const page = await browser.newPage();
              await page.setViewport({ width: 1920, height: 1080 });

              page.on('request', () => { activeRequests++; });
              page.on('requestfinished', () => { activeRequests--; });
              page.on('requestfailed', () => { activeRequests--; });

              page.on('response', async (response) => {
                  const url = response.url();
                  if (url.startsWith(baseUrl)) {
                      let relPath = url.replace(baseUrl, '').split('?')[0];
                      if (!relPath) relPath = 'index.html';
                      if (relPath.startsWith('assets/assets/')) relPath = relPath.replace('assets/assets/', 'assets/');
                      const filePath = path.join(baseDir, relPath);
                      fs.mkdirSync(path.dirname(filePath), { recursive: true });
                      try {
                          const buffer = await response.buffer();
                          fs.writeFileSync(filePath, buffer);
                          if (buffer.length > 100 * 1024) { 
                              console.log(`📦 截获: ${relPath} (${(buffer.length/1024/1024).toFixed(2)} MB)`);
                          }
                      } catch (e) {}
                  }
              });

              const waitForNetworkIdle = async (description) => {
                  console.log(`⏳ 等待 [${description}] 相关资源下载完毕...`);
                  const start = Date.now();
                  let idleFrames = 0;
                  while (Date.now() - start < 15000) {
                      if (activeRequests <= 0) {
                          idleFrames++;
                          if (idleFrames >= 3) return;
                      } else {
                          idleFrames = 0;
                      }
                      await new Promise(r => setTimeout(r, 500));
                  }
              };

              try {
                  await page.goto(baseUrl, { waitUntil: 'domcontentloaded', timeout: 60000 });
                  await page.evaluate(() => { document.querySelector('flt-semantics-placeholder')?.click(); });
                  await waitForNetworkIdle('UI 初始化');

                  console.log('📸 上传 RAW 样片...');
                  try {
                      const input = await page.$('input[type="file"]');
                      if (input) await input.uploadFile('./sample.cr2');
                  } catch(e) {}
                  await waitForNetworkIdle('RAW 底层解码引擎加载');

                  console.log('📸 上传 TIFF 样片...');
                  try {
                      const inputs = await page.$$('input[type="file"]');
                      if (inputs.length > 0) await inputs[inputs.length - 1].uploadFile('./sample.tiff');
                  } catch(e) {}
                  await waitForNetworkIdle('TIFF 解析引擎加载');

                  console.log('💥 触发导出模块...');
                  await page.evaluate(async () => {
                      const sleep = ms => new Promise(r => setTimeout(r, ms));
                      const allNodes = Array.from(document.querySelectorAll('flt-semantics'));
                      for (const node of allNodes) {
                          const label = (node.getAttribute('aria-label') || '').toLowerCase();
                          if (label.includes('export') || label.includes('save') || label.includes('tiff') || label.includes('png')) {
                              try { node.click(); await sleep(300); } catch(e){}
                          }
                      }
                  });
                  await waitForNetworkIdle('导出模块加载');
                  await new Promise(r => setTimeout(r, 5000));
              } catch (err) {
                  console.log('⚠️ 抓取警告:', err.message);
              }

              await browser.close();
          })();
          EOF
          node extract.js

      - name: Fix Absolute Paths in HTML
        run: |
          if [ -f web/index.html ]; then
            sed -i 's|src="/|src="./|g' web/index.html
            sed -i 's|href="/|href="./|g' web/index.html
          fi
          du -sh web/
          find web/ -name "*.wasm" -exec ls -lh {} \;

      - name: Setup Java
        uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }

      - name: Build Android WebView Shell
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          # 消除 Broken pipe 警告，静默接受协议
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          mkdir -p app/src/main/java/com/fotufilm/offline
          mkdir -p app/src/main/assets
          cp -r web/* app/src/main/assets/

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.fotufilm.offline">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Fotufilm" android:hardwareAccelerated="true" android:largeHeap="true" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/fotufilm/offline/MainActivity.java
          package com.fotufilm.offline;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebChromeClient;
          import androidx.appcompat.app.AppCompatActivity;
          import java.io.IOException;
          import java.io.InputStream;
          import fi.iki.elonen.NanoHTTPD;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private LocalServer server;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  webView.setLayerType(WebView.LAYER_TYPE_HARDWARE, null);
                  webView.setWebChromeClient(new WebChromeClient());
                  settings.setUserAgentString("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36");

                  try {
                      server = new LocalServer(8080);
                      server.start();
                  } catch (IOException e) {
                      e.printStackTrace();
                  }
                  webView.loadUrl("http://127.0.0.1:8080/index.html");
              }

              @Override
              protected void onDestroy() {
                  if (server != null) server.stop();
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }

              public class LocalServer extends NanoHTTPD {
                  public LocalServer(int port) { super(port); }

                  @Override
                  public Response serve(IHTTPSession session) {
                      String uri = session.getUri();
                      if (uri.equals("/")) uri = "/index.html";
                      try {
                          InputStream is = getAssets().open("web" + uri);
                          String mime = getMimeTypeForFile(uri);
                          if (uri.endsWith(".wasm")) mime = "application/wasm";
                          else if (uri.endsWith(".mjs") || uri.endsWith(".js")) mime = "application/javascript";
                          Response res = newChunkedResponse(Response.Status.OK, mime, is);
                          res.addHeader("Cross-Origin-Opener-Policy", "same-origin");
                          res.addHeader("Cross-Origin-Embedder-Policy", "require-corp");
                          res.addHeader("Access-Control-Allow-Origin", "*");
                          return res;
                      } catch (IOException e) {
                          return newFixedLengthResponse(Response.Status.NOT_FOUND, "text/plain", "Not Found");
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.fotufilm.offline'
              compileSdk 34
              defaultConfig {
                  applicationId "com.fotufilm.offline"
                  minSdk 28
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'org.nanohttpd:nanohttpd:2.3.1'
          }
          EOF

          # 🌟 核心修复：在 settings.gradle 中注入谷歌 Maven 仓库
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FotufilmOffline"
          include ':app'
          EOF

          # 设置顶层 build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

      - name: Build Android APK
        run: |
          mkdir -p ~/.gradle
          echo "systemProp.http.proxyHost=mirrors.aliyun.com" > ~/.gradle/gradle.properties
          gradle wrapper --gradle-version 8.2
          ./gradlew assembleDebug --no-daemon

      - name: Upload Fully Offline APK
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Offline-Bulletproof-V3
          path: app/build/outputs/apk/debug/app-debug.apk
