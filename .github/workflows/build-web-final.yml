name: Build Fotufilm Web Engine
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. 安装 Emscripten (WebAssembly 编译器)
      - name: Install Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          source ./emsdk_env.sh

      # 2. 编译底层引擎 (生成 bridge.js 和 WASM)
      - name: Build Web Engine
        run: |
          source emsdk/emsdk_env.sh
          chmod +x tools/build-wasm.sh
          ./tools/build-wasm.sh

      # 3. 编译 Flutter UI 并合并引擎
      - name: Build Flutter UI & Merge Engine
        run: |
          source emsdk/emsdk_env.sh
          cd flutter
          git checkout pubspec.yaml || true
          chmod +x tool/build-web.sh
          # 官方脚本会自动把上一步生成的 engine/bridge.js 等文件打包进去
          tool/build-web.sh

      - name: Upload Fully Offline Web Folder
        uses: actions/upload-artifact@v4
        with:
          name: fotufilm-web-full-engine
          path: flutter/build/web/
