name: Build Fully Offline Web
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config git libedit-dev libz3-dev libffi-dev libncurses5-dev zlib1g-dev libzstd-dev liblz4-dev libbz2-dev liblzma-dev libjpeg-dev libpng-dev libtiff-dev libwebp-dev libxml2-dev libexpat1-dev libssl-dev libcurl4-openssl-dev libpython3-dev python3-dev swig automake autoconf libtool

      # 🌟 核心修复：自动下载并配置 Halide，解决 not found 报错
      - name: Install Halide
        run: |
          wget https://github.com/halide/Halide/releases/download/v17.0.1/Halide-17.0.1-x86-64-linux.tar.gz
          tar -xzf Halide-17.0.1-x86-64-linux.tar.gz
          mv Halide-17.0.1-x86-64-linux Halide
          echo "HALIDE_ROOT=$PWD/Halide" >> $GITHUB_ENV

      - name: Install Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          source ./emsdk_env.sh

      - name: Build Engine WASM & Bridge
        run: |
          source emsdk/emsdk_env.sh
          # 环境变量已经通过 $GITHUB_ENV 注入，现在脚本应该能找到 Halide 了
          if [ -f "tools/build-wasm.sh" ]; then
            chmod +x tools/build-wasm.sh
            ./tools/build-wasm.sh
          fi

      - name: Setup Web Node Modules
        run: |
          cd web
          npm ci || true
          cd ..

      - name: Build Flutter Web UI & Merge Assets
        run: |
          source emsdk/emsdk_env.sh
          cd flutter
          git checkout pubspec.yaml || true
          
          # 编译 Flutter Web 前端
          flutter build web --wasm --release --no-web-resources-cdn
          
          # 🌟 强制全量打包兜底，确保绝对没有 404
          mkdir -p build/web/engine build/web/assets/generated
          find .. -name "bridge.js" -exec cp {} build/web/engine/ \; 2>/dev/null || true
          find .. -name "*.wasm" -not -path "*/build/web/*" -exec cp {} build/web/ \; 2>/dev/null || true
          find ../web/public -type f -exec cp {} build/web/ \; 2>/dev/null || true
          find .. -name "*.json" -path "*generated*" -exec cp {} build/web/assets/generated/ \; 2>/dev/null || true

      - name: Upload Fully Offline Web Folder
        uses: actions/upload-artifact@v4
        with:
          name: fotufilm-web-fully-offline
          path: flutter/build/web/
