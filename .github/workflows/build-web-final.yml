name: Deploy Fotufilm Web (Final Asset Fix + Eruda)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install Web Dependencies
        run: |
          cd web
          npm ci

      - name: Build Web using Official Script
        run: |
          export FOTUFILM_BASE=/fotufilm-engine/
          cd flutter
          chmod +x tool/build-web.sh
          ./tool/build-web.sh

      # 🚀 终极暴力修复：解决 assets/assets 嵌套引发的 404
      - name: Force Fix Assets Nested Path
        run: |
          cd flutter/build/web
          if [ -d "assets/assets" ]; then
            echo "🔧 检测到嵌套，正在暴力提权..."
            # 把内层 assets 文件夹直接重命名为 assets 内的内容
            mv assets/assets/* assets/
            rmdir assets/assets
            echo "✅ 嵌套已彻底删除"
          fi
          
          # 验证 controls.json 是否已经在正确位置
          echo "=== 检查文件位置 ==="
          ls -la assets/generated/controls.json || echo "⚠️ 警告：文件依然不存在！"

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          cp -r flutter/build/web/* deploy/

      # 🚀 注入神器 Eruda 控制台（方便你随时看报错）
      - name: Inject Eruda Console
        run: |
          INDEX="deploy/index.html"
          sed -i 's|<head>|<head>\n    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>\n    <script>eruda.init();</script>|' "$INDEX"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
