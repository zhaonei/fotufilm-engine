name: Build Fully Offline Web
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Flutter Web UI
        run: |
          cd flutter
          git checkout pubspec.yaml || true
          flutter clean
          
          # 基础编译外壳
          flutter build web --wasm --release --no-web-resources-cdn

      - name: Ultimate Merge All Assets & Engines
        run: |
          cd flutter/build/web
          
          # 1. 把源码 web 目录下的所有东西强行全量拷贝过来（包含 bridge.js、各种加载器）
          if [ -d "../../../web" ]; then
            cp -r ../../../web/* ./
          fi
          
          # 2. 建立底层引擎目录，防止路径报错
          mkdir -p engine
          
          # 3. 在源码里全盘搜索所有的 .wasm 和 .js 桥接文件，强行挖出来塞进包里
          find ../../.. -name "*.wasm" -not -path "*/build/web/*" -exec cp {} ./ \; 2>/dev/null || true
          find ../../.. -name "bridge.js" -exec cp {} engine/ \; 2>/dev/null || true
          
          # 4. 全盘搜索所有的胶片预设、控制配置文件 (JSON 格式) 和图标，强行塞进 assets
          mkdir -p assets/generated
          find ../../.. -name "*.json" -path "*generated*" -exec cp {} assets/generated/ \; 2>/dev/null || true
          find ../../.. -name "*.json" -not -path "*/build/web/*" -not -path "*/node_modules/*" -exec cp --parents {} . \; 2>/dev/null || true
          
          # 5. 最后清理一下，把可能多出来的无用文件删掉，保持包体纯净
          rm -rf ../../../web/node_modules || true

      - name: Upload Fully Offline Web Folder
        uses: actions/upload-artifact@v4
        with:
          name: fotufilm-web-fully-offline
          path: flutter/build/web/
