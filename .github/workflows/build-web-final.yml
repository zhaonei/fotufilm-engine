name: Build Fully Offline Web
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config git libedit-dev libz3-dev libffi-dev libncurses5-dev zlib1g-dev libzstd-dev liblz4-dev libbz2-dev liblzma-dev libjpeg-dev libpng-dev libtiff-dev libwebp-dev libxml2-dev libexpat1-dev libssl-dev libcurl4-openssl-dev libpython3-dev python3-dev swig automake autoconf libtool

      - name: Install Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          source ./emsdk_env.sh

      - name: Build Halide with WebGPU Support
        run: |
          source emsdk/emsdk_env.sh
          # 编译支持 WebGPU 的 Halide 工具链
          chmod +x tools/build-halide.sh
          ./tools/build-halide.sh --webgpu
          # 根据脚本实际安装位置设置 HALIDE_ROOT，通常为 build 目录
          if [ -d "build/halide-webgpu" ]; then
            echo "HALIDE_ROOT=$PWD/build/halide-webgpu" >> $GITHUB_ENV
          else
            echo "HALIDE_ROOT=$PWD/build/halide" >> $GITHUB_ENV
          fi

      - name: Build Engine WASM & Bridge
        run: |
          source emsdk/emsdk_env.sh
          # 编译底层引擎（含 WebGPU 支持）
          chmod +x tools/build-webgpu-wasm.sh
          ./tools/build-webgpu-wasm.sh
          
          # 编译负片处理等附加 WASM 模块
          if [ -f "tools/build-negative-wasm.sh" ]; then
            chmod +x tools/build-negative-wasm.sh
            ./tools/build-negative-wasm.sh
          fi

      - name: Setup Web Node Modules
        run: |
          cd web
          npm ci || true
          cd ..

      - name: Build Flutter Web UI & Merge Assets
        run: |
          source emsdk/emsdk_env.sh
          cd flutter
          git checkout pubspec.yaml || true
          
          # 编译 Flutter Web 前端
          flutter build web --wasm --release --no-web-resources-cdn
          
          # 🌟 暴力兜底：确保所有底层 WASM、bridge.js 和资源全部就位
          mkdir -p build/web/engine build/web/assets/generated
          
          # 查找并复制 bridge.js
          find .. -name "bridge.js" -exec cp {} build/web/engine/ \; 2>/dev/null || true
          
          # 查找并复制所有 WASM 文件
          find .. -name "*.wasm" -not -path "*/build/web/*" -exec cp {} build/web/ \; 2>/dev/null || true
          
          # 查找并复制生成的 JSON 和图标资源
          find ../web/public -type f -exec cp {} build/web/ \; 2>/dev/null || true
          find .. -name "*.json" -path "*generated*" -exec cp {} build/web/assets/generated/ \; 2>/dev/null || true
          
          # 复制 RAW/TIFF 相关的资源
          find .. -name "*.wasm" -path "*raw*" -exec cp {} build/web/ \; 2>/dev/null || true
          find .. -name "*.wasm" -path "*tiff*" -exec cp {} build/web/ \; 2>/dev/null || true

      - name: Upload Fully Offline Web Folder
        uses: actions/upload-artifact@v4
        with:
          name: fotufilm-web-fully-offline
          path: flutter/build/web/
