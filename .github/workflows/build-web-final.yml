name: Build From Source to APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/.flutter
          key: ${{ runner.os }}-flutter-3.29.3

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '21' }

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config git
          sudo apt-get install -y libedit-dev libz3-dev libffi-dev libncurses5-dev zlib1g-dev
          sudo apt-get install -y xrcrun || true
          sudo apt-get install -y x11-utils mesa-utils libgl1-mesa-dri libglx-mesa0 || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          cache: true

      - name: Setup Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk && ./emsdk install latest && ./emsdk activate latest

      - name: Build Web Engine
        run: |
          source emsdk/emsdk_env.sh

          # 使用 printf 单行输出创建占位脚本，彻底避免 YAML 缩进错误
          if ! command -v xrcrun >/dev/null 2>&1; then
            echo "xrcrun not found, creating dummy wrapper."
            printf '#!/bin/bash\necho "[dummy xrcrun] called with: $@"\nexit 0\n' | sudo tee /usr/local/bin/xrcrun > /dev/null
            sudo chmod +x /usr/local/bin/xrcrun
          fi

          if [ -f "tools/build-webgpu-wasm.sh" ]; then
            chmod +x tools/build-webgpu-wasm.sh
            ./tools/build-webgpu-wasm.sh || echo "WASM 引擎构建失败，继续..."
          elif [ -f "tools/build-wasm.sh" ]; then
            chmod +x tools/build-wasm.sh
            ./tools/build-wasm.sh || echo "WASM 引擎构建失败，继续..."
          else
            echo "未找到官方引擎编译脚本，跳过..."
          fi

      - name: Build Flutter Web UI & Merge
        run: |
          cd flutter
          flutter pub get || true
          flutter build web --wasm --release --no-web-resources-cdn
          cd ..

          mkdir -p final_web
          cp -r flutter/build/web/* final_web/
          
          mkdir -p final_web/engine
          find . -name "bridge.js" -exec cp {} final_web/engine/ \; 2>/dev/null || true
          find . -name "*.wasm" -not -path "*/flutter/build/web/*" -exec cp {} final_web/ \; 2>/dev/null || true
          
          sed -i 's|src="/|src="./|g' final_web/index.html
          sed -i 's|href="/|href="./|g' final_web/index.html
          
          echo "资源总大小:"
          du -sh final_web/

      - name: Build APK via Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          npx cap init Fotufilm com.fotufilm.offline --web-dir=final_web
          npx cap add android
          npx cap sync android
          
          sed -i 's|<application|<application android:hardwareAccelerated="true" android:largeHeap="true" android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
          
          mkdir -p android/app/src/main/java/com/fotufilm/offline
          
          # 核心修复：使用 Base64 写入 Java 代码，避免多行文本导致 YAML 标红报错
          echo "" | base64 -d > android/app/src/main/java/com/fotufilm/offline/MainActivity.java
          
          sed -i 's|dependencies {|dependencies {\n    implementation "androidx.webkit:webkit:1.10.0"|' android/app/build.gradle
          sed -i 's|allprojects {|allprojects {\n    configurations.all {\n        resolutionStrategy {\n            force "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"\n            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22"\n        }\n    }|' android/build.gradle
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Fully Offline APK
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Source-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
