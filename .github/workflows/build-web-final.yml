name: Build From Source to APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 🚀 1. 开启缓存，大幅减少重复下载时间
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/.flutter
          key: ${{ runner.os }}-flutter-3.29.3

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 🚀 2. 环境准备：Java 21 满足最新 Capacitor，安装 C++ 编译依赖
      - name: Setup Java
        uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '21' }

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config git
          sudo apt-get install -y libedit-dev libz3-dev libffi-dev libncurses5-dev zlib1g-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          cache: true

      # 🚀 3. 编译底层 C++/WASM 引擎
      - name: Setup Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk && ./emsdk install latest && ./emsdk activate latest

      - name: Build Web Engine
        run: |
          source emsdk/emsdk_env.sh
          # 寻找并执行官方的 WASM 编译脚本
          if [ -f "tools/build-webgpu-wasm.sh" ]; then
            chmod +x tools/build-webgpu-wasm.sh
            ./tools/build-webgpu-wasm.sh
          elif [ -f "tools/build-wasm.sh" ]; then
            chmod +x tools/build-wasm.sh
            ./tools/build-wasm.sh
          else
            echo "未找到官方引擎编译脚本，跳过..."
          fi

      # 🚀 4. 编译 Flutter UI 并合并资源，强制修复绝对路径
      - name: Build Flutter Web UI & Merge
        run: |
          cd flutter
          # 避免 pubspec 版本卡壳，如果报错就尝试降级
          flutter pub get || true
          flutter build web --wasm --release --no-web-resources-cdn
          cd ..

          mkdir -p final_web
          cp -r flutter/build/web/* final_web/
          
          # 暴力合并引擎文件
          mkdir -p final_web/engine
          find . -name "bridge.js" -exec cp {} final_web/engine/ \; 2>/dev/null || true
          find . -name "*.wasm" -not -path "*/flutter/build/web/*" -exec cp {} final_web/ \; 2>/dev/null || true
          
          # 核心修复：将所有绝对路径 / 改成相对路径 ./
          sed -i 's|src="/|src="./|g' final_web/index.html
          sed -i 's|href="/|href="./|g' final_web/index.html
          
          echo "资源总大小:"
          du -sh final_web/

      # 🚀 5. Capacitor 封壳并注入极致性能补丁
      - name: Build APK via Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          npx cap init Fotufilm com.fotufilm.offline --web-dir=final_web
          npx cap add android
          npx cap sync android
          
          # 开启大内存和硬件加速
          sed -i 's|<application|<application android:hardwareAccelerated="true" android:largeHeap="true" android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
          
          # 注入跨域头（解锁满血多线程）和调试接口
          mkdir -p android/app/src/main/java/com/fotufilm/offline
          cat << 'EOF' > android/app/src/main/java/com/fotufilm/offline/MainActivity.java
          package com.fotufilm.offline;
          import com.getcapacitor.BridgeActivity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeWebViewClient;
          import android.webkit.WebResourceResponse;
          import android.webkit.ConsoleMessage;
          import android.webkit.WebChromeClient;
          import android.util.Log;
          import java.util.HashMap;
          import java.util.Map;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView.setWebContentsDebuggingEnabled(true);
                  this.bridge.getWebView().setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onConsoleMessage(ConsoleMessage msg) {
                          Log.d("FOTUFILM_JS", msg.message() + " at " + msg.sourceId() + ":" + msg.lineNumber());
                          return true;
                      }
                  });
                  this.bridge.getWebView().setWebViewClient(new BridgeWebViewClient(this.bridge) {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, android.webkit.WebResourceRequest request) {
                          WebResourceResponse response = super.shouldInterceptRequest(view, request);
                          if (response != null) {
                              Map<String, String> headers = response.getResponseHeaders();
                              if (headers == null) headers = new HashMap<>();
                              headers.put("Cross-Origin-Opener-Policy", "same-origin");
                              headers.put("Cross-Origin-Embedder-Policy", "require-corp");
                              headers.put("Access-Control-Allow-Origin", "*");
                              response.setResponseHeaders(headers);
                          }
                          return response;
                      }
                  });
              }
          }
          EOF
          
          sed -i 's|dependencies {|dependencies {\n    implementation "androidx.webkit:webkit:1.10.0"|' android/app/build.gradle
          # 强力镇压 Kotlin 版本冲突
          sed -i 's|allprojects {|allprojects {\n    configurations.all {\n        resolutionStrategy {\n            force "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"\n            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22"\n        }\n    }|' android/build.gradle
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Fully Offline APK
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Source-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
