name: Build 100% Offline Fotufilm APK (Absolute Final)
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer & Prepare Samples
        shell: bash
        run: |
          npm init -y
          npm install puppeteer
          
          echo "正在下载真实测试样片..."
          wget -q --tries=3 --timeout=15 -O sample.cr2 "https://raw.pixls.us/getfile.php/1425/nice/Canon%20-%20EOS%205D%20Mark%20III%20-%2012bit%20%283%3A2%29.CR2" || \
          wget -q --tries=3 --timeout=15 -O sample.cr2 "https://github.com/letmaik/rawpy-test-data/raw/master/RAW_CANON_40D_SRAW_V103.CR2"
          
          wget -q --tries=3 --timeout=15 -O sample.tiff "https://github.com/python-pillow/Pillow/raw/main/Tests/images/hopper.tif" || \
          wget -q --tries=3 --timeout=15 -O sample.tiff "https://filesamples.com/samples/image/tiff/sample_640%C3%97426.tiff"
          
          ls -lh sample.cr2 sample.tiff

      - name: Run Ultimate Deep Extractor
        run: |
          cat << 'EOF' > extract.js
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          const path = require('path');

          (async () => {
              const baseUrl = 'https://fotufilm.com/demo/';
              const baseDir = './web';
              let activeRequests = 0;

              console.log('🚀 启动 1:1 深度复刻抓取引擎...');
              const browser = await puppeteer.launch({ 
                  args: ['--no-sandbox', '--disable-setuid-sandbox'],
                  headless: "new" 
              });
              const page = await browser.newPage();
              await page.setViewport({ width: 1920, height: 1080 });

              page.on('request', () => { activeRequests++; });
              page.on('requestfinished', () => { activeRequests--; });
              page.on('requestfailed', () => { activeRequests--; });

              page.on('response', async (response) => {
                  const url = response.url();
                  if (url.startsWith(baseUrl)) {
                      let relPath = url.replace(baseUrl, '').split('?')[0];
                      if (!relPath) relPath = 'index.html';
                      if (relPath.startsWith('assets/assets/')) relPath = relPath.replace('assets/assets/', 'assets/');
                      const filePath = path.join(baseDir, relPath);
                      fs.mkdirSync(path.dirname(filePath), { recursive: true });
                      try {
                          const buffer = await response.buffer();
                          fs.writeFileSync(filePath, buffer);
                      } catch (e) {}
                  }
              });

              const waitForNetworkIdle = async (description) => {
                  const start = Date.now();
                  let idleFrames = 0;
                  while (Date.now() - start < 20000) {
                      if (activeRequests <= 0) {
                          idleFrames++;
                          if (idleFrames >= 4) return;
                      } else {
                          idleFrames = 0;
                      }
                      await new Promise(r => setTimeout(r, 500));
                  }
              };

              try {
                  await page.goto(baseUrl, { waitUntil: 'domcontentloaded', timeout: 60000 });
                  await page.evaluate(() => { document.querySelector('flt-semantics-placeholder')?.click(); });
                  await waitForNetworkIdle('主界面初始化');

                  try {
                      const input = await page.$('input[type="file"]');
                      if (input) await input.uploadFile('./sample.cr2');
                  } catch(e) {}
                  await waitForNetworkIdle('RAW 引擎加载');

                  try {
                      const inputs = await page.$$('input[type="file"]');
                      if (inputs.length > 0) await inputs[inputs.length - 1].uploadFile('./sample.tiff');
                  } catch(e) {}
                  await waitForNetworkIdle('TIFF 引擎加载');

                  await page.evaluate(async () => {
                      const sleep = ms => new Promise(r => setTimeout(r, ms));
                      for (let round = 0; round < 5; round++) {
                          const interactables = Array.from(document.querySelectorAll(
                              'flt-semantics[role="button"], flt-semantics[role="menuitem"], flt-semantics[role="option"], flt-semantics[role="switch"], flt-semantics[role="slider"], flt-semantics[role="combobox"]'
                          ));
                          for (const el of interactables) {
                              if (el.offsetParent === null) continue;
                              try {
                                  if (el.getAttribute('role') === 'slider') {
                                      el.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight' }));
                                      el.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowLeft' }));
                                  } else {
                                      el.click();
                                  }
                                  await sleep(200);
                              } catch (e) {}
                          }
                          await sleep(1000);
                      }
                  });
                  await waitForNetworkIdle('配置加载');
              } catch (err) {
                  console.log('⚠️ 抓取异常:', err.message);
              }
              await browser.close();
          })();
          EOF
          node extract.js

      - name: Fix Paths & List
        run: |
          if [ -f web/index.html ]; then
            sed -i 's|src="/|src="./|g' web/index.html
            sed -i 's|href="/|href="./|g' web/index.html
          fi
          du -sh web/

      - name: Setup Java
        uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }

      # 🌟 核心绝杀 1：手动下载 Gradle 8.6 压缩包
      - name: Download and Setup Gradle 8.6
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip
          unzip -q gradle-8.6-bin.zip
          echo "$PWD/gradle-8.6/bin" >> $GITHUB_PATH

      - name: Build Android WebView Shell
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk

          mkdir -p android-app/app/src/main/java/com/fotufilm/offline
          mkdir -p android-app/app/src/main/assets
          cp -r web/* android-app/app/src/main/assets/

          cd android-app

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.fotufilm.offline">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Fotufilm" android:hardwareAccelerated="true" android:largeHeap="true" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/fotufilm/offline/MainActivity.java
          package com.fotufilm.offline;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebChromeClient;
          import androidx.appcompat.app.AppCompatActivity;
          import java.io.IOException;
          import java.io.InputStream;
          import fi.iki.elonen.NanoHTTPD;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private LocalServer server;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  webView.setLayerType(WebView.LAYER_TYPE_HARDWARE, null);
                  webView.setWebChromeClient(new WebChromeClient());
                  settings.setUserAgentString("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36");

                  try {
                      server = new LocalServer(8080);
                      server.start();
                  } catch (IOException e) {
                      e.printStackTrace();
                  }
                  webView.loadUrl("http://127.0.0.1:8080/index.html");
              }

              @Override
              protected void onDestroy() {
                  if (server != null) server.stop();
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }

              public class LocalServer extends NanoHTTPD {
                  public LocalServer(int port) { super(port); }

                  @Override
                  public Response serve(IHTTPSession session) {
                      String uri = session.getUri();
                      if (uri.equals("/")) uri = "/index.html";
                      try {
                          InputStream is = getAssets().open("web" + uri);
                          String mime = getMimeTypeForFile(uri);
                          if (uri.endsWith(".wasm")) mime = "application/wasm";
                          else if (uri.endsWith(".mjs") || uri.endsWith(".js")) mime = "application/javascript";
                          Response res = newChunkedResponse(Response.Status.OK, mime, is);
                          res.addHeader("Cross-Origin-Opener-Policy", "same-origin");
                          res.addHeader("Cross-Origin-Embedder-Policy", "require-corp");
                          res.addHeader("Access-Control-Allow-Origin", "*");
                          return res;
                      } catch (IOException e) {
                          return newFixedLengthResponse(Response.Status.NOT_FOUND, "text/plain", "Not Found");
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.fotufilm.offline'
              compileSdk 34
              defaultConfig {
                  applicationId "com.fotufilm.offline"
                  minSdk 28
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'org.nanohttpd:nanohttpd:2.3.1'
          }
          EOF

          # 极度干净的仓库配置
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FotufilmOffline"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.4.0' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          systemProp.http.proxyHost=mirrors.aliyun.com
          systemProp.https.proxyHost=mirrors.aliyun.com
          EOF

      # 🌟 核心绝杀 2：使用刚才下载的 Gradle 8.6 直接构建，彻底踢开系统和 Wrapper
      - name: Build Android APK
        run: |
          cd android-app
          gradle assembleDebug --no-daemon --refresh-dependencies --stacktrace

      - name: Upload Fully Offline APK
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Offline-Final
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
