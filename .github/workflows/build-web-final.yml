name: Deploy Flutter Web (WASM + Cross-Origin Isolation)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Prepare Bridge Script
        run: |
          if [ -f "web/src/flutter-bridge.js" ]; then
            cp web/src/flutter-bridge.js flutter/web/bridge.js
          elif [ -f "flutter/web/src/flutter-bridge.js" ]; then
            cp flutter/web/src/flutter-bridge.js flutter/web/bridge.js
          fi

      - name: Build Flutter Web (WASM)
        run: |
          cd flutter
          flutter pub get
          flutter build web --wasm --release --no-web-resources-cdn --base-href=/fotufilm-engine/
          cd ..

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          cp -r flutter/build/web/* deploy/
          cp coi-serviceworker.js deploy/
          
          if [ -f "flutter/web/bridge.js" ]; then cp flutter/web/bridge.js deploy/; fi
          if [ -f "flutter/build/web/flutter_bootstrap.js" ]; then cp flutter/build/web/flutter_bootstrap.js deploy/; fi
          if [ -f "flutter/build/web/flutter.js" ]; then cp flutter/build/web/flutter.js deploy/; fi
          
          # 如果存在嵌套的 assets/assets 目录，将其内容上移一层，消除重复前缀
          if [ -d "deploy/assets/assets" ]; then
            cp -r deploy/assets/assets/* deploy/assets/
            rm -rf deploy/assets/assets
            echo "✅ 已移除重复的 assets/assets 嵌套目录"
          fi
          
          echo "=== deploy/assets 目录结构 ==="
          ls -la deploy/assets/ | head -20

      - name: Inject Scripts & Fix HTML Paths
        run: |
          INDEX="deploy/index.html"
          
          # 关键修复：为 bridge.js 添加 type="module" 属性
          sed -i 's|<head>|<head>\n    <script src="coi-serviceworker.js"></script>\n    <script type="module" src="bridge.js"></script>|' "$INDEX"
          
          # 确保 flutter_bootstrap.js 是普通脚本（非 module）
          sed -i 's|src="/flutter_bootstrap.js"|src="./flutter_bootstrap.js"|g' "$INDEX"
          sed -i 's|src="/flutter.js"|src="./flutter.js"|g' "$INDEX"
          
          echo "=== 注入后的 index.html 头部 ==="
          head -n 15 "$INDEX"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
