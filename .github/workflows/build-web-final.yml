name: Mirror Official Web App (Headless Chrome)
on: workflow_dispatch
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer & Dependencies
        run: |
          npm init -y
          npm install puppeteer

      - name: Run Headless Mirror Script
        run: |
          cat << 'EOF' > mirror.js
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          const path = require('path');

          (async () => {
              const baseUrl = 'https://fotufilm.com/demo/';
              const baseDir = './web';
              
              console.log('启动无头 Chrome 浏览器...');
              const browser = await puppeteer.launch({
                  args: ['--no-sandbox', '--disable-setuid-sandbox']
              });
              const page = await browser.newPage();

              // 拦截所有网络请求和响应
              page.on('response', async (response) => {
                  const url = response.url();
                  // 只抓取 demo 目录下的资源
                  if (url.startsWith(baseUrl)) {
                      const relativePath = url.replace(baseUrl, '');
                      // 如果路径为空，默认为 index.html
                      const filePath = path.join(baseDir, relativePath || 'index.html');
                      
                      // 只抓取有用的文件类型（特别是 .wasm 和 .js）
                      if (url.match(/\.(js|wasm|json|html|css|png|jpg|jpeg|svg|ttf|otf|woff|woff2)$/) || relativePath === '') {
                          fs.mkdirSync(path.dirname(filePath), { recursive: true });
                          try {
                              const buffer = await response.buffer();
                              fs.writeFileSync(filePath, buffer);
                              console.log(`✅ 成功抓取: ${relativePath || 'index.html'} (${(buffer.length/1024/1024).toFixed(2)} MB)`);
                          } catch (e) {
                              console.log(`❌ 抓取失败: ${relativePath}`);
                          }
                      }
                  }
              });

              console.log('正在访问网页并等待其加载完毕（包括后台加载大文件）...');
              // 等待网络空闲，确保所有大文件都下载完毕
              await page.goto(baseUrl, { waitUntil: 'networkidle0', timeout: 90000 });
              
              // 额外等待几秒，确保可能有延迟加载的引擎文件被捕获
              await new Promise(r => setTimeout(r, 5000));

              await browser.close();
              console.log('🎉 全量镜像抓取完毕！');
          })();
          EOF
          
          node mirror.js

      - name: Verify Mirror Size
        run: |
          echo "====== 抓取结果统计 ======"
          du -sh web/ || true
          echo "====== 检查核心 WASM 引擎 ======"
          find web/ -name "*.wasm" -exec ls -lh {} \;

      - name: Upload Fully Offline Web Folder
        uses: actions/upload-artifact@v4
        with:
          name: fotufilm-web-full-mirror
          path: web/
