name: Build Fully Offline Web (Source Halide)
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config git libedit-dev libz3-dev libffi-dev libncurses5-dev zlib1g-dev libzstd-dev liblz4-dev libbz2-dev liblzma-dev libjpeg-dev libpng-dev libtiff-dev libwebp-dev libxml2-dev libexpat1-dev libssl-dev libcurl4-openssl-dev libpython3-dev python3-dev swig automake autoconf libtool

      # 🌟 核心修复：从源码编译 Halide，并开启 WebGPU 支持
      - name: Build Halide with WebGPU from Source
        run: |
          git clone https://github.com/halide/Halide.git -b v17.0.1 --depth 1
          cd Halide
          mkdir build && cd build
          
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHalide_SHARED_LLVM=YES \
            -DTARGET_WEBASSEMBLY=OFF \
            -DTARGET_VULKAN=ON \
            -DWITH_TESTS=OFF \
            -DWITH_TUTORIALS=OFF \
            -DWITH_PYTHON_BINDINGS=OFF \
            -DWITH_DOCS=OFF \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/Halide
          
          ninja
          ninja install
          
          # 设置 HALIDE_ROOT 指向编译产物
          echo "HALIDE_ROOT=$GITHUB_WORKSPACE/Halide" >> $GITHUB_ENV

      - name: Install Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          source ./emsdk_env.sh

      - name: Build Web Engine
        run: |
          source emsdk/emsdk_env.sh
          chmod +x tools/build-wasm.sh
          ./tools/build-wasm.sh

      - name: Build Flutter UI & Merge Engine
        run: |
          source emsdk/emsdk_env.sh
          cd flutter
          git checkout pubspec.yaml || true
          chmod +x tool/build-web.sh
          tool/build-web.sh

      - name: Upload Fully Offline Web Folder
        uses: actions/upload-artifact@v4
        with:
          name: fotufilm-web-full-engine
          path: flutter/build/web/
