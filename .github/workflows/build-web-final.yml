name: Deploy Fotufilm Web (Final Asset Fix + Eruda)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install Web Dependencies
        run: |
          cd web
          npm ci

      # 1. 纯官方脚本编译
      - name: Build Web using Official Script
        run: |
          export FOTUFILM_BASE=/fotufilm-engine/
          cd flutter
          chmod +x tool/build-web.sh
          ./tool/build-web.sh

      # 🚀 2. 终极修复：双管齐下，既改清单，又移文件
      - name: Force Fix Assets & Manifest
        run: |
          cd flutter/build/web
          
          echo "=== 1. 修复 AssetManifest 清单 ==="
          if [ -f "AssetManifest.json" ]; then
            sed -i 's|"assets/assets/|"assets/|g' AssetManifest.json
            echo "✅ AssetManifest.json 路径已修正"
          fi
          if [ -f "AssetManifest.bin.json" ]; then
            sed -i 's|"assets/assets/|"assets/|g' AssetManifest.bin.json
            echo "✅ AssetManifest.bin.json 路径已修正"
          fi

          echo "=== 2. 移动物理文件 ==="
          if [ -d "assets/assets" ]; then
            cp -rf assets/assets/* assets/
            rm -rf assets/assets
            echo "✅ 物理文件已成功上移"
          fi
          
          echo "=== 3. 验证最终文件位置 ==="
          ls -la assets/generated/controls.json || echo "⚠️ 警告：文件依然不存在！"

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          cp -r flutter/build/web/* deploy/

      # 3. 注入神器 Eruda 控制台
      - name: Inject Eruda Console
        run: |
          INDEX="deploy/index.html"
          sed -i 's|<head>|<head>\n    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>\n    <script>eruda.init();</script>|' "$INDEX"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
