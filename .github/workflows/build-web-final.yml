name: Build Fully Offline Web
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'

      - name: Build Web with Full Assets
        run: |
          cd flutter
          
          git checkout pubspec.yaml || true
          flutter clean
          
          # 🌟 核心修复：删除了被废弃的 --pwa-strategy 参数
          # 保留 --wasm (极致性能) 和 --no-web-resources-cdn (强制本地化所有字体和资源)
          flutter build web --wasm --release --no-web-resources-cdn

      - name: Upload Fully Offline Web Folder
        uses: actions/upload-artifact@v4
        with:
          name: fotufilm-web-fully-offline
          path: flutter/build/web/
