name: Deploy Flutter Web (WASM + Cross-Origin Isolation)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: { submodules: recursive }

      # 1. 升级 Flutter 到 3.41.9（搭配 Dart 3.11.5，满足 >=3.11.5 要求）
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      # 2. 编译 WASM 引擎
      - name: Build Flutter Web (WASM)
        run: |
          cd flutter
          flutter pub get
          flutter build web --wasm --release --no-web-resources-cdn
          cd ..

      # 3. 整理部署资源并自动查找复制遗漏的 bridge.js 与 bootstrap 文件
      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          cp -r flutter/build/web/* deploy/

          echo "=== 复制跨源隔离脚本 ==="
          cp coi-serviceworker.js deploy/
          
          echo "=== 自动搜索并复制 bridge.js ==="
          BRIDGE_FILE=$(find . -name "bridge.js" -not -path "*/node_modules/*" | head -n 1)
          if [ -n "$BRIDGE_FILE" ]; then
            cp "$BRIDGE_FILE" deploy/
            echo "✅ 已成功将 $BRIDGE_FILE 复制到 deploy 根目录"
          else
            echo "⚠️ 未在源码中找到 bridge.js"
          fi
          
          echo "=== 确保 flutter_bootstrap.js 存在 ==="
          if [ ! -f "deploy/flutter_bootstrap.js" ] && [ -f "flutter/build/web/flutter_bootstrap.js" ]; then
            cp flutter/build/web/flutter_bootstrap.js deploy/
            echo "✅ 已从构建目录补全 flutter_bootstrap.js"
          fi
          
          echo "=== 部署目录最终文件清单 ==="
          ls -la deploy/

      # 4. 注入隔离脚本标签
      - name: Inject Cross-Origin Isolation Script
        run: |
          INDEX="deploy/index.html"
          sed -i 's|<head>|<head>\n    <script src="coi-serviceworker.js"></script>|' "$INDEX"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
