name: Deploy Fotufilm Web (Final Fix)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install Web Dependencies
        run: |
          cd web
          npm ci

      # 1. 官方脚本编译
      - name: Build Web using Official Script
        run: |
          export FOTUFILM_BASE=/fotufilm-engine/
          cd flutter
          chmod +x tool/build-web.sh
          ./tool/build-web.sh

      # 2. 终极修复：物理移动文件 + 同步修正清单
      - name: Force Fix Assets Path and Manifest
        run: |
          cd flutter/build/web
          
          echo "=== 1. 将嵌套文件移动到正确位置 ==="
          if [ -d "assets/assets" ]; then
            cp -rf assets/assets/* assets/
            rm -rf assets/assets
            echo "✅ 物理文件移动完成"
          fi

          echo "=== 2. 修正 AssetManifest.json 中的路径 ==="
          if [ -f "AssetManifest.json" ]; then
            sed -i 's|"assets/assets/|"assets/|g' AssetManifest.json
            echo "✅ AssetManifest.json 已修正"
          fi
          
          if [ -f "AssetManifest.bin.json" ]; then
            sed -i 's|"assets/assets/|"assets/|g' AssetManifest.bin.json
            echo "✅ AssetManifest.bin.json 已修正"
          fi
          
          echo "=== 3. 验证文件位置 ==="
          ls -la assets/generated/controls.json || echo "⚠️ 文件仍不存在"

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          cp -r flutter/build/web/* deploy/

      # 3. 注入 Eruda 控制台，方便随时查看
      - name: Inject Eruda Console
        run: |
          INDEX="deploy/index.html"
          sed -i 's|<head>|<head>\n    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>\n    <script>eruda.init();</script>|' "$INDEX"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
