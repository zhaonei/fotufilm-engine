name: Deploy Flutter Web (WASM + Cross-Origin Isolation)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: { submodules: recursive }

      # 🚀 核心修复：升级 Flutter 到 3.41.9，自带 Dart 3.11.5
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      # 🚀 直接构建，删除所有强行改版本的复杂步骤
      - name: Build Flutter Web (WASM)
        run: |
          cd flutter
          flutter pub get
          flutter build web --wasm --release --no-web-resources-cdn
          cd ..

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          cp -r flutter/build/web/* deploy/
          cp coi-serviceworker.js deploy/
          ls -la deploy/

      - name: Inject Cross-Origin Isolation Script
        run: |
          INDEX="deploy/index.html"
          sed -i 's|<head>|<head>\n    <script src="coi-serviceworker.js"></script>|' "$INDEX"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
