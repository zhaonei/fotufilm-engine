name: Mirror Official Web App
on: workflow_dispatch
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Download Official Web App
        run: |
          # 🌟 使用伪装浏览器UA进行全站深度镜像
          wget --mirror \
               --convert-links \
               --adjust-extension \
               --page-requisites \
               --no-parent \
               --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
               -e robots=off \
               https://fotufilm.com/demo/
          
          # 把下载下来的文件夹重命名为 web，方便后面打包
          if [ -d "fotufilm.com" ]; then
            mv fotufilm.com web
          fi
          
          # 🌟 全盘兜底：确保所有隐藏的 .wasm 和 .json 资源都被抓下来了
          # 有时候 wget 会漏掉动态加载的文件，我们把所有能找到的资源强行整合
          mkdir -p final_output
          cp -r web/* final_output/ 2>/dev/null || true
          
          echo "====================================="
          echo "打包完成，请检查文件列表，确认是否包含巨大的 .wasm 文件："
          find final_output -name "*.wasm" -exec ls -lh {} \;
          echo "====================================="

      - name: Upload Fully Offline Web Folder
        uses: actions/upload-artifact@v4
        with:
          name: fotufilm-web-full-mirror
          path: final_output/
