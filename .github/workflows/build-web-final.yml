name: Deploy Flutter Web (WASM + Cross-Origin Isolation)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      # 1. 官方规范：将 flutter-bridge.js 及所有相关模块脚本复制到 web 根目录
      - name: Prepare Bridge Scripts
        run: |
          if [ -d "web/src" ]; then
            # 复制所有 JS 文件到 flutter/web 根目录
            cp -r web/src/*.js flutter/web/ 2>/dev/null || true
            # 官方文档指出 flutter-bridge.js 是关键入口
            if [ -f "web/src/flutter-bridge.js" ]; then
              cp web/src/flutter-bridge.js flutter/web/bridge.js
            fi
            echo "✅ Copied all JS modules from web/src to flutter/web"
          else
            echo "⚠️ Warning: web/src directory not found"
          fi

      - name: Build Flutter Web (WASM)
        run: |
          cd flutter
          flutter pub get
          flutter build web --wasm --release --no-web-resources-cdn --base-href=/fotufilm-engine/
          cd ..

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          cp -r flutter/build/web/* deploy/
          cp coi-serviceworker.js deploy/
          
          # 确保从 flutter/web 复制过来的 bridge.js 等核心脚本在部署根目录
          cp flutter/web/*.js deploy/ 2>/dev/null || true
          
          # 🚀 修复 assets/assets 重复嵌套问题
          if [ -d "deploy/assets/assets" ]; then
            cp -r deploy/assets/assets/* deploy/assets/
            rm -rf deploy/assets/assets
            echo "✅ 已修复 assets/assets 重复前缀"
          fi
          
          echo "=== 部署根目录文件 (前30行) ==="
          ls -la deploy/ | head -30

      - name: Inject Scripts & Fix HTML Paths
        run: |
          INDEX="deploy/index.html"
          
          # 注入隔离脚本，并将 bridge.js 以 type="module" 方式加载
          sed -i 's|<head>|<head>\n    <script src="coi-serviceworker.js"></script>\n    <script type="module" src="bridge.js"></script>|' "$INDEX"
          
          # 修正 flutter.js 和 flutter_bootstrap.js 的路径
          sed -i 's|src="/flutter.js"|src="./flutter.js"|g' "$INDEX"
          sed -i 's|src="/flutter_bootstrap.js"|src="./flutter_bootstrap.js"|g' "$INDEX"
          
          echo "=== 注入后的 index.html 头部 ==="
          head -n 20 "$INDEX"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
