name: Deploy Fotufilm Web (Final Fixed Assets Path)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install Web Dependencies
        run: |
          cd web
          npm ci

      # 1. 调用官方脚本编译（内部已处理 base-href 和 Vite 打包）
      - name: Build Web using Official Script
        run: |
          export FOTUFILM_BASE=/fotufilm-engine/
          cd flutter
          chmod +x tool/build-web.sh
          ./tool/build-web.sh

      # 2. 核心修复：将 assets/assets/ 下的内容移动到 assets/，解决 404
      - name: Fix Assets Nested Path
        run: |
          ASSETS_DIR="flutter/build/web/assets"
          if [ -d "$ASSETS_DIR/assets" ]; then
            echo "🔧 检测到 assets/assets 嵌套，正在移动文件..."
            # 将内层 assets 的内容移动到外层 assets 根目录
            cp -rf "$ASSETS_DIR/assets/"* "$ASSETS_DIR/"
            # 删除空的嵌套文件夹
            rm -rf "$ASSETS_DIR/assets"
            echo "✅ 嵌套路径修复完成"
          else
            echo "✅ 未检测到嵌套路径"
          fi
          
          # 验证文件是否已在正确位置
          echo "=== 检查 controls.json 位置 ==="
          find "$ASSETS_DIR" -name "controls.json"

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          cp -r flutter/build/web/* deploy/
          if [ -f "coi-serviceworker.js" ]; then cp coi-serviceworker.js deploy/; fi

      # 3. 注入跨源隔离脚本（用于 WASM 多线程）
      - name: Inject Cross-Origin Isolation Script
        run: |
          INDEX="deploy/index.html"
          sed -i 's|<head>|<head>\n    <script src="coi-serviceworker.js"></script>|' "$INDEX"
          echo "=== 注入后检查 ==="
          head -n 15 "$INDEX"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
