name: Build Fotufilm (Vulkan GPU Ultimate)

on: workflow_dispatch

env:
  EMSCRIPTEN_VERSION: '3.1.61'
  FLUTTER_VERSION: '3.29.3'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Setup Java
        uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '21' }

      - name: Install System Dependencies (含 Halide)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config git libedit-dev libz3-dev libffi-dev libncurses5-dev zlib1g-dev
          # 安装 Halide 及其依赖（LLVM, lld, wabt 等）
          sudo apt-get install -y llvm lld wabt
          # 从官方 GitHub Releases 下载 Halide 预编译包
          wget https://github.com/halide/Halide/releases/download/v21.0.0/halide-linux-x86-64-gcc-21.0.0.tar.gz
          tar -xzf halide-linux-x86-64-gcc-21.0.0.tar.gz
          sudo cp -r halide /usr/local/

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Emscripten (Pinned)
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install ${{ env.EMSCRIPTEN_VERSION }}
          ./emsdk activate ${{ env.EMSCRIPTEN_VERSION }}

      - name: Build Web Engine
        run: |
          source emsdk/emsdk_env.sh
          if [ -f "tools/build-webgpu-wasm.sh" ]; then
            chmod +x tools/build-webgpu-wasm.sh
            ./tools/build-webgpu-wasm.sh
          elif [ -f "tools/build-wasm.sh" ]; then
            chmod +x tools/build-wasm.sh
            ./tools/build-wasm.sh
          fi

      - name: Build Flutter Web UI (CanvasKit)
        run: |
          cd flutter
          flutter pub get
          flutter build web --web-renderer canvaskit --release --no-web-resources-cdn
          cd ..
          mkdir -p final_web
          cp -r flutter/build/web/* final_web/
          mkdir -p final_web/engine
          # ✅ 根据脚本截图，引擎产物输出在 web/public 目录
          cp -r web/public/* final_web/engine/ 2>/dev/null || true

      - name: Capacitor Setup & WebKit 1.18.0
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init Fotufilm com.fotufilm.offline --web-dir=final_web
          npx cap add android
          npx cap sync android
          sed -i 's|dependencies {|dependencies {\n    implementation "androidx.webkit:webkit:1.18.0"|' android/app/build.gradle

      - name: Inject Native Vulkan & Hardware Acceleration
        run: |
          mkdir -p android/app/src/main/java/com/fotufilm/offline
          cat > android/app/src/main/java/com/fotufilm/offline/MainActivity.java <<'JAVA_EOF'
          package com.fotufilm.offline;
          import android.os.Bundle;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView.setWebContentsDebuggingEnabled(true);
                  WebView webView = this.bridge.getWebView();
                  webView.setLayerType(WebView.LAYER_TYPE_HARDWARE, null);
              }
          }
          JAVA_EOF
          
          mkdir -p android/app/src/main/assets
          echo '_ --use-webgpu-adapter=vulkan' > android/app/src/main/assets/webview-command-line

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Ultimate-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
