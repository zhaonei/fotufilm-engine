name: Deploy Fotufilm Web (Max Performance)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install Web Dependencies
        run: |
          cd web
          npm ci

      - name: Build Web using Official Script
        run: |
          export FOTUFILM_BASE=/fotufilm-engine/
          cd flutter
          chmod +x tool/build-web.sh
          ./tool/build-web.sh

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          cp -r flutter/build/web/* deploy/
          if [ -f "coi-serviceworker.js" ]; then cp coi-serviceworker.js deploy/; fi

      # 🚀 终极魔法：强行伪造 assets/assets 目录，骗过引擎！
      - name: Forced Copy Assets (Bypass Bug)
        run: |
          cd deploy
          if [ -d "assets" ]; then
            echo "🔧 正在强行创建 assets/assets 假目录..."
            mkdir -p assets/assets
            cp -rf assets/* assets/assets/ 
            echo "✅ 假目录伪造完成"
          fi

      # 🚀 注入多线程加速脚本
      - name: Inject Performance Script
        run: |
          INDEX="deploy/index.html"
          sed -i 's|<head>|<head>\n    <script src="coi-serviceworker.js"></script>|' "$INDEX"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
