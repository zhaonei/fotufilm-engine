name: Build 100% Offline Fotufilm APK (Capacitor Release Final V3)
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 🌟 满足 Capacitor 最新版要求的 Java 21
      - name: Setup Java
        uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '21' }

      - name: Download Full Engine from Release
        run: |
          mkdir -p web-export/engine
          wget -q https://github.com/zhaonei/fotufilm-engine/releases/download/v1.0/index.html -O web-export/index.html
          wget -q https://github.com/zhaonei/fotufilm-engine/releases/download/v1.0/bridge.js -O web-export/engine/bridge.js
          wget -q https://github.com/zhaonei/fotufilm-engine/releases/download/v1.0/builder.wasm -O web-export/engine/builder.wasm
          wget -q https://github.com/zhaonei/fotufilm-engine/releases/download/v1.0/decoder.wasm -O web-export/engine/decoder.wasm
          wget -q https://github.com/zhaonei/fotufilm-engine/releases/download/v1.0/fotufilm.wasm -O web-export/engine/fotufilm.wasm
          ls -lh web-export/engine/

      - name: Build APK via Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          npx cap init Fotufilm com.fotufilm.offline --web-dir=web-export
          npx cap add android
          npx cap sync android
          
          # 1. 开启硬件加速大内存
          sed -i 's|<application|<application android:hardwareAccelerated="true" android:largeHeap="true" android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
          
          # 2. 注入跨域头和原生错误日志拦截（万能调试接口）
          mkdir -p android/app/src/main/java/com/fotufilm/offline
          cat << 'EOF' > android/app/src/main/java/com/fotufilm/offline/MainActivity.java
          package com.fotufilm.offline;

          import com.getcapacitor.BridgeActivity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeWebViewClient;
          import android.webkit.WebResourceResponse;
          import android.webkit.ConsoleMessage;
          import android.webkit.WebChromeClient;
          import android.util.Log;
          import java.util.HashMap;
          import java.util.Map;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  // 🌟 调试关键：允许 Chrome 远程调试（chrome://inspect）
                  WebView.setWebContentsDebuggingEnabled(true);
                  
                  // 🌟 调试关键：拦截 JS 的 Console 报错，输出到 Android Logcat
                  this.bridge.getWebView().setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onConsoleMessage(ConsoleMessage consoleMessage) {
                          Log.d("FOTUFILM_JS", consoleMessage.message() + " -- From line " +
                                  consoleMessage.lineNumber() + " of " + consoleMessage.sourceId());
                          return true;
                      }
                  });

                  // 🌟 运行关键：强制注入 WASM 多线程所需的跨域头
                  this.bridge.getWebView().setWebViewClient(new BridgeWebViewClient(this.bridge) {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, android.webkit.WebResourceRequest request) {
                          WebResourceResponse response = super.shouldInterceptRequest(view, request);
                          if (response != null) {
                              Map<String, String> headers = response.getResponseHeaders();
                              if (headers == null) headers = new HashMap<>();
                              headers.put("Cross-Origin-Opener-Policy", "same-origin");
                              headers.put("Cross-Origin-Embedder-Policy", "require-corp");
                              headers.put("Access-Control-Allow-Origin", "*");
                              response.setResponseHeaders(headers);
                          }
                          return response;
                      }
                  });
              }
          }
          EOF

          # 加入 webkit 依赖
          sed -i 's|dependencies {|dependencies {\n    implementation "androidx.webkit:webkit:1.10.0"|' android/app/build.gradle
          
          # 🌟 核心修复：强制统一 Kotlin 版本，解决 Duplicate class 冲突
          sed -i 's|allprojects {|allprojects {\n    configurations.all {\n        resolutionStrategy {\n            force "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"\n            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22"\n        }\n    }|' android/build.gradle
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Fully Offline APK
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Capacitor-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
