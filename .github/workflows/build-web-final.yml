name: Deploy Flutter Web (WASM + Cross-Origin Isolation)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      # 1. 精确复制 bridge.js 和配套的辅助 JS 文件
      - name: Prepare Bridge Scripts
        run: |
          if [ -f "web/src/flutter-bridge.js" ]; then
            cp web/src/flutter-bridge.js flutter/web/bridge.js
            echo "✅ Copied flutter-bridge.js to flutter/web/bridge.js"
          fi
          # 复制 web/src 下所有相关的模块脚本，防止遗漏
          if [ -d "web/src" ]; then
            cp -r web/src/*.js flutter/web/ 2>/dev/null || true
            echo "✅ Copied all JS modules from web/src"
          fi

      - name: Build Flutter Web (WASM)
        run: |
          cd flutter
          flutter pub get
          flutter build web --wasm --release --no-web-resources-cdn --base-href=/fotufilm-engine/
          cd ..

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          cp -r flutter/build/web/* deploy/
          cp coi-serviceworker.js deploy/
          
          # 从 flutter/web 复制已准备好的 bridge.js 等核心脚本
          cp flutter/web/*.js deploy/ 2>/dev/null || true
          
          # 🚀 修复 assets/assets 重复前缀问题
          if [ -d "deploy/assets/assets" ]; then
            cp -r deploy/assets/assets/* deploy/assets/
            rm -rf deploy/assets/assets
            echo "✅ 已移除重复的 assets/assets 嵌套目录"
          fi
          
          # 确保 flutter_bootstrap.js 在根目录
          if [ -f "flutter/build/web/flutter_bootstrap.js" ]; then
            cp flutter/build/web/flutter_bootstrap.js deploy/
          fi
          
          echo "=== 部署根目录文件 ==="
          ls -la deploy/ | head -30

      - name: Inject Scripts & Fix HTML Paths
        run: |
          INDEX="deploy/index.html"
          
          # 为 bridge.js 添加 type="module"，同时修正相关脚本路径
          sed -i 's|<head>|<head>\n    <script src="coi-serviceworker.js"></script>\n    <script type="module" src="bridge.js"></script>|' "$INDEX"
          
          # 强制将引用路径改为相对路径
          sed -i 's|src="/flutter.js"|src="./flutter.js"|g' "$INDEX"
          sed -i 's|src="/flutter_bootstrap.js"|src="./flutter_bootstrap.js"|g' "$INDEX"
          
          echo "=== 注入后的 index.html 头部 ==="
          head -n 20 "$INDEX"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
