name: Deploy Flutter Web (WASM + Cross-Origin Isolation)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      # 🚀 步骤1：编译前将缺失的 bridge.js 注入网页源码根目录
      - name: Prepare Bridge Script
        run: |
          if [ -f "web/src/flutter-bridge.js" ]; then
            cp web/src/flutter-bridge.js flutter/web/bridge.js
            echo "✅ Copied bridge.js to flutter/web"
          else
            echo "⚠️ bridge.js source not found"
          fi

      # 🚀 步骤2：加入 --base-href，确保 GitHub Pages 路径正确解析
      - name: Build Flutter Web (WASM)
        run: |
          cd flutter
          flutter pub get
          flutter build web --wasm --release --no-web-resources-cdn --base-href=/fotufilm-engine/
          cd ..

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          cp -r flutter/build/web/* deploy/
          cp coi-serviceworker.js deploy/
          
          # 查漏补缺：确保 bridge.js 和 bootstrap 都在
          if [ -f "flutter/web/bridge.js" ]; then cp flutter/web/bridge.js deploy/; fi
          if [ -f "flutter/build/web/flutter_bootstrap.js" ]; then cp flutter/build/web/flutter_bootstrap.js deploy/; fi
          
          echo "=== 部署文件清单 ==="
          ls -la deploy/

      # 注入跨源隔离脚本
      - name: Inject Cross-Origin Isolation Script
        run: |
          INDEX="deploy/index.html"
          sed -i 's|<head>|<head>\n    <script src="coi-serviceworker.js"></script>|' "$INDEX"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
