name: Build Fully Offline Web (Full Engine)
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config git libedit-dev libz3-dev libffi-dev libncurses5-dev zlib1g-dev libzstd-dev liblz4-dev libbz2-dev liblzma-dev libjpeg-dev libpng-dev libtiff-dev libwebp-dev libxml2-dev libexpat1-dev libssl-dev libcurl4-openssl-dev libpython3-dev python3-dev swig automake autoconf libtool

      - name: Install Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          source ./emsdk_env.sh

      # 1. 编译 WebGPU 版 Halide 工具链
      - name: Build Halide with WebGPU Support
        run: |
          source emsdk/emsdk_env.sh
          chmod +x tools/build-halide.sh
          ./tools/build-halide.sh --webgpu
          # 设置 HALIDE_ROOT 指向编译产物
          HALIDE_ROOT=$(find $PWD -name "Halide.h" -path "*include*" -exec dirname {} \; | head -n 1 | xargs dirname)
          echo "HALIDE_ROOT=$HALIDE_ROOT" >> $GITHUB_ENV

      # 2. 编译底层 Web 引擎
      - name: Build Web Engine
        run: |
          source emsdk/emsdk_env.sh
          chmod +x tools/build-wasm.sh
          ./tools/build-wasm.sh

      # 3. 编译 Flutter UI 并全量合并
      - name: Build Flutter UI & Merge All Assets
        run: |
          source emsdk/emsdk_env.sh
          cd flutter
          git checkout pubspec.yaml || true
          flutter build web --wasm --release --no-web-resources-cdn
          
          # 全量兜底合并，确保所有引擎文件、资源、配置全部到位
          mkdir -p build/web/engine build/web/assets/generated
          
          find .. -name "bridge.js" -exec cp {} build/web/engine/ \; 2>/dev/null || true
          find .. -name "*.wasm" -not -path "*/build/web/*" -exec cp {} build/web/ \; 2>/dev/null || true
          find ../web/public -type f -exec cp {} build/web/ \; 2>/dev/null || true
          find .. -name "*.json" -path "*generated*" -exec cp {} build/web/assets/generated/ \; 2>/dev/null || true
          find .. -name "*.json" -path "*assets*" -exec cp --parents {} build/web/ \; 2>/dev/null || true

      - name: Upload Fully Offline Web Folder
        uses: actions/upload-artifact@v4
        with:
          name: fotufilm-web-full-engine
          path: flutter/build/web/
