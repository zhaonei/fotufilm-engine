name: Deploy Fotufilm Web (Official Build)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: { submodules: recursive }

      # 1. 官方构建依赖：Node.js 22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 2. 官方构建依赖：Flutter 3.41.9
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      # 3. 官方构建依赖：安装 web 目录下的 Vite 依赖
      - name: Install Web Dependencies
        run: |
          cd web
          npm ci

      # 4. 直接调用官方的构建脚本！传入子目录前缀
      - name: Build Web using Official Script
        run: |
          export FOTUFILM_BASE=/fotufilm-engine/
          cd flutter
          chmod +x tool/build-web.sh
          ./tool/build-web.sh

      # 5. 整理部署目录
      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          # 官方脚本编译出来的产物都在 flutter/build/web 里
          cp -r flutter/build/web/* deploy/
          
          # 把跨源隔离脚本复制进根目录
          if [ -f "coi-serviceworker.js" ]; then cp coi-serviceworker.js deploy/; fi

      # 6. 注入隔离脚本（官方 HTML 默认没有，我们需要加上）
      - name: Inject Cross-Origin Isolation Script
        run: |
          INDEX="deploy/index.html"
          # 官方脚本已经把路径处理得非常完美了，我们只需要在 head 中插入隔离脚本
          sed -i 's|<head>|<head>\n    <script src="coi-serviceworker.js"></script>|' "$INDEX"
          
          echo "=== 检查 index.html ==="
          head -n 15 "$INDEX"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
