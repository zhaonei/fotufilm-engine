name: Build Fotofilm X RAW APK

on:
  push:
    branches: [ xraw-android-app, main ]
    paths:
      - 'xraw-android/**'
      - '.github/workflows/build-xraw-apk.yml'
  pull_request:
    paths:
      - 'xraw-android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses and install platform/build-tools/NDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          NDK_DIR=$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$NDK_DIR" ]; then
            for pkg in "ndk;27.0.12077973" "ndk;27.2.12479018" "ndk;26.3.11579264"; do
              if "$SM" "$pkg" > /dev/null 2>&1; then
                NDK_DIR=$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1 || true); break
              fi
            done
          fi
          [ -n "$NDK_DIR" ] || { echo "NDK 安装失败" >&2; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK=$NDK_DIR"
          ls -l "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"

      - name: Unit self-test (d185 codec / recipe round-trip)
        working-directory: xraw-android
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          mkdir -p out/test
          # 编译全部源码 + 自测（避免新增文件漏加导致 CI 与本地不一致）
          javac --release 11 -nowarn -cp "$SDK/platforms/android-35/android.jar" -d out/test \
            tools/selftest/SelfTest.java $(find app/src -name '*.java')
          java -cp "$SDK/platforms/android-35/android.jar:out/test" SelfTest

      - name: Build signed APK
        working-directory: xraw-android
        run: |
          set -e
          chmod +x build.sh
          ./build.sh

      - name: Verify with aapt2 (authoritative gate)
        working-directory: xraw-android
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT2="$SDK/build-tools/35.0.0/aapt2"
          "$AAPT2" version
          echo "--- APK 内容 ---"
          unzip -l out/FotofilmXRAW.apk
          echo "--- 必须存在 resources.arsc（否则真机报“解析包失败”）---"
          unzip -l out/FotofilmXRAW.apk | grep -q "resources.arsc"
          echo "--- aapt2 dump badging（权威解析）---"
          "$AAPT2" dump badging out/FotofilmXRAW.apk | head -20
          echo "--- 签名校验 ---"
          java -jar "$SDK/build-tools/35.0.0/lib/apksigner.jar" verify --verbose out/FotofilmXRAW.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FotofilmXRAW-apk
          path: xraw-android/out/FotofilmXRAW.apk
          if-no-files-found: error

      - name: Attach APK to release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: xraw-android/out/FotofilmXRAW.apk
