name: Build Fotufilm Web

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Web
        run: |
          cd flutter
          flutter clean
          flutter pub get
          flutter build web --wasm --release --no-web-resources-cdn
          
          # === 终极暴力缝合逻辑 ===
          # 1. 全盘搜索 engine 文件夹并复制到输出目录的根目录
          find .. -type d -name "engine" -exec cp -rn {} build/web/ \; || true
          
          # 2. 全盘搜索 bridge.js 确保它在 engine 文件夹里
          find .. -type f -name "bridge.js" -exec mkdir -p build/web/engine/ \; -exec cp -rn {} build/web/engine/ \; || true
          
          # 3. 复制所有 web 静态资源
          if [ -d web ]; then cp -rn web/* build/web/ || true; fi
          if [ -d ../web ]; then cp -rn ../web/* build/web/ || true; fi
          
          # 4. 修复缺失的 generated 配置
          find .. -type d -name "generated" -exec mkdir -p build/web/assets/assets/generated \; -exec cp -rn {}/* build/web/assets/assets/generated/ \; || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fotufilm-web-build
          path: flutter/build/web/
