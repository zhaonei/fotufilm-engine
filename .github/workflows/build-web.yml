name: Build Fotufilm Web

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Web
        run: |
          cd flutter
          flutter clean
          flutter pub get
          flutter build web --wasm --release --no-web-resources-cdn
          
          # ======= 终极补全大法 =======
          cd build/web
          
          # 1. 直接从官方 Demo 站点下载缺失的 bridge.js
          mkdir -p engine
          wget -q https://fotufilm.com/demo/engine/bridge.js -O engine/bridge.js || true
          
          # 2. 下载缺失的 generated 配置文件
          mkdir -p assets/assets/generated
          wget -q https://fotufilm.com/demo/assets/assets/generated/controls.json -O assets/assets/generated/controls.json || true
          wget -q https://fotufilm.com/demo/assets/assets/generated/material-symbols.json -O assets/assets/generated/material-symbols.json || true
          wget -q https://fotufilm.com/demo/assets/assets/generated/app-icon.png -O assets/assets/generated/app-icon.png || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fotufilm-web-build
          path: flutter/build/web/
