name: Build Fotufilm Web

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare and Build Web
        run: |
          cd flutter
          flutter clean
          flutter pub get
          
          # 1. 尝试运行项目自带的准备脚本（如果存在），生成配置文件
          if [ -f tool/prepare.sh ]; then bash tool/prepare.sh; fi
          if [ -f ../tool/prepare.sh ]; then bash ../tool/prepare.sh; fi
          if [ -f prepare.sh ]; then bash prepare.sh; fi
          
          # 2. 编译 Web 版本
          flutter build web --wasm --release --no-web-resources-cdn
          
          # 3. 暴力缝合：把项目里所有相关的静态资源和生成文件全部塞进输出目录
          # 解决 bridge.js 缺失
          cp -rn web/* build/web/ || true
          cp -rn ../web/* build/web/ || true
          if [ -d ../engine ]; then cp -rn ../engine/* build/web/engine/ || true; fi
          
          # 解决 assets/generated 配置缺失
          mkdir -p build/web/assets/assets/generated
          cp -rn assets/generated/* build/web/assets/assets/generated/ || true
          cp -rn ../assets/generated/* build/web/assets/assets/generated/ || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fotufilm-web-build
          path: flutter/build/web/
