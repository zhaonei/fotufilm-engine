name: Build Final V28

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install ALL System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config git gnupg2 \
            llvm-17-dev libclang-17-dev lld-17 liblld-17-dev clang-17 \
            libedit-dev libz3-dev libffi-dev libncurses5-dev libncursesw5-dev \
            zlib1g-dev libzstd-dev liblz4-dev libbz2-dev liblzma-dev \
            libjpeg-dev libpng-dev libtiff-dev libwebp-dev \
            libxml2-dev libexpat1-dev libssl-dev libcurl4-openssl-dev \
            libpython3-dev python3-dev swig automake autoconf libtool

      - name: Enable Swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Download Swift Host Toolchain
        run: |
          wget https://download.swift.org/swift-6.3.3-release/ubuntu2204/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu22.04.tar.gz
          tar -xzf swift-6.3.3-RELEASE-ubuntu22.04.tar.gz
          mv swift-6.3.3-RELEASE-ubuntu22.04 swift-host

      - name: Setup NDK 27
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip android-ndk-r27d-linux.zip

      - name: Download Swift Android SDK
        run: |
          wget https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz
          mkdir -p $HOME/.swiftpm/swift-sdks
          mv swift-6.3.3-RELEASE_android.artifactbundle.tar.gz $HOME/.swiftpm/swift-sdks/
          cd $HOME/.swiftpm/swift-sdks/
          tar -xzf swift-6.3.3-RELEASE_android.artifactbundle.tar.gz

      - name: Build Halide Host (Minimal)
        run: |
          wget https://github.com/halide/Halide/archive/refs/tags/v17.0.1.tar.gz
          tar -xzf v17.0.1.tar.gz
          cd Halide-17.0.1
          
          rm -rf python_bindings
          
          mkdir build-host && cd build-host
          LLVM_DIR=$(llvm-config-17 --cmakedir)
          CLANG_DIR="/usr/lib/llvm-17/lib/cmake/clang"
          LLD_DIR="/usr/lib/llvm-17/lib/cmake/lld"
          
          cmake .. \
            -G Ninja \
            -DLLVM_DIR="$LLVM_DIR" \
            -DClang_DIR="$CLANG_DIR" \
            -DLLD_DIR="$LLD_DIR" \
            -DHalide_SHARED_LLVM=YES \
            -DTARGET_WEBASSEMBLY=OFF \
            -DTARGET_CUDA=OFF \
            -DTARGET_OPENCL=OFF \
            -DTARGET_VULKAN=ON \
            -DWITH_TESTS=OFF \
            -DWITH_TUTORIALS=OFF \
            -DWITH_PYTHON_BINDINGS=OFF \
            -DWITH_DOCS=OFF \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/build/halide-host"
            
          ninja
          ninja install

      # 🌟 核心修复：自动修改源码，注释掉不支持的特性
      - name: Patch Source Code for Halide v17
        run: |
          echo "正在修复 Gpu.h 里的版本兼容问题..."
          # 强行把报错的那一行代码注释掉
          sed -i 's/if (simulator) target.set_feature(Target::Simulator);/\/\/ if (simulator) target.set_feature(Target::Simulator);/g' Sources/FotufilmHalide/Pipeline/Gpu.h
          
          echo "检查是否修改成功（输出为空或带有 // 即为成功）："
          grep -n "set_feature(Target::Simulator)" Sources/FotufilmHalide/Pipeline/Gpu.h || true

      - name: Build APK
        env:
          SWIFT_TOOLCHAIN: ${{ github.workspace }}/swift-host
          SWIFT_SDK: swift-6.3.3-RELEASE_android
          ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk-r27d
          HALIDE_ROOT: ${{ github.workspace }}/build/halide-host
          MAKEFLAGS: "-j2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: |
          chmod +x flutter/build-android.sh
          ./flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Android-APK
          path: build/flutter-host/Fotufilm.apk
