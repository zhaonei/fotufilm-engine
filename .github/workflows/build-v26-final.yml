name: Build V26 Final APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils git gnupg2 libc6-dev libcurl4-openssl-dev libedit2 \
            libgcc-9-dev libpython3.8 libsqlite3-0 libstdc++-9-dev libxml2-dev \
            libz3-dev pkg-config tzdata zlib1g-dev \
            cmake make g++ automake autoconf libtool \
            libhalide17-1-dev
          echo "HALIDE_ROOT=/usr" | sudo tee -a /etc/environment

      - name: Download Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r26d" | sudo tee -a /etc/environment

      # 下载宿主机 Swift
      - name: Download Swift Host Toolchain
        run: |
          wget https://download.swift.org/swift-6.3.3-release/ubuntu2204/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu22.04.tar.gz
          tar -xzf swift-6.3.3-RELEASE-ubuntu22.04.tar.gz
          mv swift-6.3.3-RELEASE-ubuntu22.04 swift-host

      # 下载安卓目标 SDK
      - name: Download Swift Android SDK
        run: |
          wget https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz
          tar -xzf swift-6.3.3-RELEASE_android.artifactbundle.tar.gz

      - name: Build Android APK
        run: |
          SWIFT_USR="$GITHUB_WORKSPACE/swift-host/usr"
          
          echo "====== 🚨 执行暴力环境注入 🚨 ======"
          
          # 1. 把系统默认的 swift 命令直接覆盖成我们下载的宿主机版本！
          # 这样无论子脚本开多少个进程，它只要敲 swift，找的就是这个！
          sudo ln -sf "$SWIFT_USR/bin/swift" /usr/local/bin/swift
          sudo ln -sf "$SWIFT_USR/bin/swiftc" /usr/local/bin/swiftc
          
          # 2. 强行把 export 塞进底层编译脚本的第一行，无视任何进程隔离
          sed -i '1i export SWIFT_TOOLCHAIN="'$SWIFT_USR'"\nexport PATH="'$SWIFT_USR'/bin:$PATH"' tools/build-android-engine.sh
          echo "底层引擎脚本第一行已修改为："
          head -n 1 tools/build-android-engine.sh
          
          # 3. 验证当前系统里的 swift
          which swift
          swift --version
          echo "===================================="
          
          chmod +x flutter/build-android.sh
          ./flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Android-APK
          path: build/flutter-host/Fotufilm.apk
