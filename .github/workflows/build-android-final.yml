
name: Build Android Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Swift Android Toolchain
        uses: skiptools/swift-android-action@v2
        with:
          android-api-level: 28
          swift-version: '6.3'
          run-tests: false
          build-tests: false
        continue-on-error: true

      - name: Download Android NDK
        if: always()
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

      - name: Install Halide via APT
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y libhalide17-1-dev
          echo "HALIDE_ROOT=/usr" >> $GITHUB_ENV

      - name: Build Android APK
        if: always()
        run: |
          echo "🚨🚨🚨 正在运行最新代码 V3 🚨🚨🚨"
          echo "====== 开始搜索 Swift 工具链 ======"
          
          # 🌟 精准搜索路径：在 .config/swiftpm/toolchains 里面找 swift 可执行文件
          SWIFT_BIN=$(find /home/runner/.config/swiftpm/toolchains -name "swift" -type f | head -n 1)
          
          if [ -n "$SWIFT_BIN" ]; then
            TOOLCHAIN_DIR=$(dirname $(dirname $SWIFT_BIN))
            echo "✅ 找到 Swift 路径: $TOOLCHAIN_DIR"
            export SWIFT_TOOLCHAIN="$TOOLCHAIN_DIR"
            export SDKROOT="$TOOLCHAIN_DIR"
            export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          else
            echo "⚠️ 未找到路径，强行指定默认版本..."
            export SWIFT_TOOLCHAIN="/home/runner/.config/swiftpm/toolchains/swift-6.4.2-RELEASE-android/usr"
            export SDKROOT="$SWIFT_TOOLCHAIN"
            export PATH="$SWIFT_TOOLCHAIN/bin:$PATH"
          fi
          
          echo "====== 当前使用的 Swift 版本 ======"
          which swift
          swift --version
          
          chmod +x flutter/build-android.sh
          ./flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Android-APK
          path: build/flutter-host/Fotufilm.apk
