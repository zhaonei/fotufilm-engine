name: Build Android Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Swift Toolchain via Skiptools
        uses: skiptools/swift-android-action@v2
        with:
          android-api-level: 28
          swift-version: '6.3'
          run-tests: false
          build-tests: false
        continue-on-error: true

      - name: Download Android NDK
        if: always()
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

      - name: Install Halide via APT
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y libhalide17-1-dev
          echo "HALIDE_ROOT=/usr" >> $GITHUB_ENV

      - name: Build Android APK
        if: always()
        run: |
          echo "🚨🚨🚨 正在运行最终成功版 V22 (防断网重试) 🚨🚨🚨"
          
          # 锁定正确的 6.4.2 路径
          export SWIFT_TOOLCHAIN="/home/runner/.config/swiftpm/toolchains/swift-6.4.2-RELEASE-android/usr"
          export SDKROOT="$SWIFT_TOOLCHAIN"
          export PATH="$SWIFT_TOOLCHAIN/bin:$PATH"
          
          echo "====== 验证工具链 ======"
          which swift
          swift --version
          
          # 🌟 核心网络补丁：包装 curl 命令，强制断线重试 5 次
          echo "====== 注入 curl 重试补丁 ======"
          sudo mv /usr/bin/curl /usr/bin/curl-original
          sudo tee /usr/bin/curl > /dev/null << 'EOF'
          #!/bin/bash
          /usr/bin/curl-original --retry 5 --retry-delay 3 --retry-all-errors "$@"
          EOF
          sudo chmod +x /usr/bin/curl
          
          chmod +x flutter/build-android.sh
          bash flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Android-APK
          path: build/flutter-host/Fotufilm.apk
        
