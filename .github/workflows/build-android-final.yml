
name: Build Android Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Download Android NDK
        if: always()
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

      - name: Install Halide via APT
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y libhalide17-1-dev
          echo "HALIDE_ROOT=/usr" >> $GITHUB_ENV

      - name: Download Official Swift Android SDK
        if: always()
        run: |
          echo "📦 下载官方 Swift 6.3.3 Android SDK..."
          wget https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz
          tar -xzf swift-6.3.3-RELEASE_android.artifactbundle.tar.gz
          echo "✅ 解压完成！"

      - name: Build Android APK
        if: always()
        run: |
          echo "🚨🚨🚨 正在运行绝对成功版 V19 🚨🚨🚨"
          
          # 1. 在刚才解压的所有目录中，全盘搜索真实的 swift 实体文件
          echo "====== 开始寻找真实的 swift 文件 ======"
          REAL_SWIFT_BIN=$(find $GITHUB_WORKSPACE -type f -name "swift" | grep "usr/bin" | head -n 1)
          
          if [ -n "$REAL_SWIFT_BIN" ]; then
            echo "✅ 找到了！真实路径是: $REAL_SWIFT_BIN"
            BIN_DIR=$(dirname $REAL_SWIFT_BIN)
            USR_DIR=$(dirname $BIN_DIR)
            
            # 2. 强行把正确的路径覆盖到当前系统的环境变量中
            export PATH="$BIN_DIR:$PATH"
            export SWIFT_TOOLCHAIN="$USR_DIR"
            export SDKROOT="$USR_DIR"
            
            # 3. 用 sed 将路径硬编码写进构建脚本的最前面，防止它内部新建子进程时丢失变量
            sed -i '1i export PATH="'$BIN_DIR':$PATH"\nexport SWIFT_TOOLCHAIN="'$USR_DIR'"\nexport SDKROOT="'$USR_DIR'"' flutter/build-android.sh
            
          else
            echo "❌ 找不到实体 swift 文件，这包肯定有问题了。"
            exit 1
          fi
          
          echo "====== 验证工具链 ======"
          which swift
          swift --version
          echo "========================="
          
          chmod +x flutter/build-android.sh
          bash flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Android-APK
          path: build/flutter-host/Fotufilm.apk
