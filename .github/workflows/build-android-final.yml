name: Build Android Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Download Android NDK
        if: always()
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

      - name: Install Halide via APT
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y libhalide17-1-dev
          echo "HALIDE_ROOT=/usr" >> $GITHUB_ENV

      - name: Download Official Swift Android SDK
        if: always()
        run: |
          echo "📦 下载官方 Swift 6.3.3 Android SDK..."
          wget https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz
          tar -xzf swift-6.3.3-RELEASE_android.artifactbundle.tar.gz
          
          # 直接把包内真实的绝对路径提取出来，写入环境变量，供后续所有步骤使用
          SDK_PATH="$GITHUB_WORKSPACE/swift-6.3.3-RELEASE_android.artifactbundle/swift-android/usr"
          echo "SWIFT_TOOLCHAIN=$SDK_PATH" >> $GITHUB_ENV
          echo "SDKROOT=$SDK_PATH" >> $GITHUB_ENV
          echo "$SDK_PATH/bin" >> $GITHUB_PATH
          
          echo "✅ 官方 SDK 解压完成，环境变量已注入系统"

      - name: Build Android APK
        if: always()
        run: |
          echo "🚨🚨🚨 正在运行终极成功版 V18 🚨🚨🚨"
          
          echo "====== 验证当前使用的 Swift ======"
          which swift
          swift --version
          echo "==================================="
          
          # 直接调用，环境变量已经在上一层完全注入好了
          chmod +x flutter/build-android.sh
          bash flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Android-APK
          path: build/flutter-host/Fotufilm.apk
