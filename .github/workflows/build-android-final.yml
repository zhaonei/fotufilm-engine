name: Build Android Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Swift Toolchain via Skiptools
        uses: skiptools/swift-android-action@v2
        with:
          android-api-level: 28
          swift-version: '6.3'
          run-tests: false
          build-tests: false
        continue-on-error: true

      - name: Download Android NDK
        if: always()
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

      - name: Install Halide via APT
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y libhalide17-1-dev
          echo "HALIDE_ROOT=/usr" >> $GITHUB_ENV

      - name: Build Android APK
        if: always()
        run: |
          echo "🚨🚨🚨 正在运行终极成功版 V14 (暴力注入) 🚨🚨🚨"
          
          # 直接锁定刚才验证成功的绝对路径
          SWIFT_USR="/home/runner/.config/swiftpm/toolchains/swift-6.3-RELEASE/usr"
          
          # 强行把环境变量写到 build-android.sh 的第一行，防止它在内部丢失
          sed -i '1i export SWIFT_TOOLCHAIN="'$SWIFT_USR'"\nexport SDKROOT="'$SWIFT_USR'"\nexport PATH="'$SWIFT_USR'/bin:$PATH"' flutter/build-android.sh
          
          # 验证注入是否成功
          echo "=== build-android.sh 前 5 行内容 ==="
          head -n 5 flutter/build-android.sh
          echo "===================================="
          
          chmod +x flutter/build-android.sh
          ./flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Android-APK
          path: build/flutter-host/Fotufilm.apk
