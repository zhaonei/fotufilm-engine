name: Build Android Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Swift Toolchain via Skiptools
        uses: skiptools/swift-android-action@v2
        with:
          android-api-level: 28
          swift-version: '6.3'
          run-tests: false
          build-tests: false
        continue-on-error: true

      - name: Download Android NDK
        if: always()
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

      - name: Install Halide via APT
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y libhalide17-1-dev
          echo "HALIDE_ROOT=/usr" >> $GITHUB_ENV

      - name: Build Android APK
        if: always()
        run: |
          echo "🚨🚨🚨 正在运行终极成功版 V16 (全盘搜索) 🚨🚨🚨"
          
          # 寻找官方安装的真正 Android SDK 路径
          echo "====== 开始搜索真实的 Android SDK 路径 ======"
          ANDROID_SWIFT_PATH=$(find /home/runner -type d -name "swift-*-android" | head -n 1)
          
          if [ -n "$ANDROID_SWIFT_PATH" ]; then
            echo "✅ 找到真实的 Android SDK 路径: $ANDROID_SWIFT_PATH"
            export SWIFT_TOOLCHAIN="$ANDROID_SWIFT_PATH/usr"
            export SDKROOT="$SWIFT_TOOLCHAIN"
            export PATH="$SWIFT_TOOLCHAIN/bin:$PATH"
          else
            echo "❌ 找不到，尝试用默认的..."
            export SWIFT_TOOLCHAIN="/home/runner/.config/swiftpm/toolchains/swift-6.3-RELEASE/usr"
            export PATH="$SWIFT_TOOLCHAIN/bin:$PATH"
          fi
          
          echo "====== 验证当前的 Swift 工具链 ======"
          which swift
          swift --version
          echo "====================================="
          
          chmod +x flutter/build-android.sh
          # 使用 bash 显式运行，确保环境变量不丢失
          bash flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Android-APK
          path: build/flutter-host/Fotufilm.apk
