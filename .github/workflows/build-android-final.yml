name: Build Android Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Swift Android Toolchain
        uses: skiptools/swift-android-action@v2
        with:
          android-api-level: 28
          swift-version: '6.3'
          run-tests: false
          build-tests: false
        continue-on-error: true

      - name: Download Android NDK
        if: always()
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

      - name: Install Halide via APT
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y libhalide17-1-dev
          echo "HALIDE_ROOT=/usr" >> $GITHUB_ENV

      - name: Build Android APK
        if: always()
        run: |
          echo "🚨🚨🚨 正在运行最新代码 V5 (强行定位) 🚨🚨🚨"
          
          # 用通配符抓取刚刚 skiptools 下载的安卓版 Swift 路径
          REAL_SWIFT_PATH=$(find /home/runner/.config/swiftpm/toolchains -maxdepth 1 -type d -name "swift-*-RELEASE-android" | head -n 1)
          
          if [ -n "$REAL_SWIFT_PATH" ]; then
            echo "✅ 抓到真实的 Swift 路径: $REAL_SWIFT_PATH"
            export SWIFT_TOOLCHAIN="$REAL_SWIFT_PATH/usr"
            export SDKROOT="$REAL_SWIFT_PATH/usr"
            export PATH="$REAL_SWIFT_PATH/usr/bin:$PATH"
          else
            echo "❌ 彻底没找到，说明下载真的挂了，准备报错。"
          fi
          
          echo "====== 当前使用的 Swift 版本 ======"
          which swift
          swift --version
          
          chmod +x flutter/build-android.sh
          ./flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Android-APK
          path: build/flutter-host/Fotufilm.apk
