name: Build Android Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Download Android NDK
        if: always()
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

      - name: Install Halide via APT
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y libhalide17-1-dev
          echo "HALIDE_ROOT=/usr" >> $GITHUB_ENV

      # 🌟 彻底换回官方旧版的完整交叉编译工具链
      - name: Download Full Swift Android Toolchain
        if: always()
        run: |
          echo "📦 下载 Swift 6.0.3 完整 Android 工具链..."
          wget https://download.swift.org/swift-6.0.3-release/android/swift-6.0.3-RELEASE-android-24-sdk.tar.gz
          tar -xzf swift-6.0.3-RELEASE-android-24-sdk.tar.gz
          echo "✅ 解压完成！"

      - name: Build Android APK
        if: always()
        run: |
          echo "🚨🚨🚨 正在运行终极成功版 V20 (完整工具链版) 🚨🚨🚨"
          
          # 不放过任何普通文件或者快捷方式
          echo "====== 搜索实体/链接 swift 可执行文件 ======"
          SWIFT_BIN=$(find . -path "*/usr/bin/swift" \( -type f -o -type l \) | head -n 1)
          
          if [ -n "$SWIFT_BIN" ]; then
            echo "✅ 找到了！路径是: $SWIFT_BIN"
            USR_DIR=$(dirname $(dirname $SWIFT_BIN))
            export SWIFT_TOOLCHAIN="$USR_DIR"
            export SDKROOT="$USR_DIR"
            export PATH="$USR_DIR/bin:$PATH"
            
            # 强行写入脚本，防止变量丢失
            sed -i '1i export PATH="'$USR_DIR'/bin:$PATH"\nexport SWIFT_TOOLCHAIN="'$USR_DIR'"\nexport SDKROOT="'$USR_DIR'"' flutter/build-android.sh
            
          else
            echo "❌ 找不到，指定绝对路径 fallback..."
            USR_DIR="$GITHUB_WORKSPACE/swift-6.0.3-RELEASE-android-24-sdk/usr"
            export SWIFT_TOOLCHAIN="$USR_DIR"
            export SDKROOT="$USR_DIR"
            export PATH="$USR_DIR/bin:$PATH"
            sed -i '1i export PATH="'$USR_DIR'/bin:$PATH"\nexport SWIFT_TOOLCHAIN="'$USR_DIR'"\nexport SDKROOT="'$USR_DIR'"' flutter/build-android.sh
          fi
          
          echo "====== 验证工具链 ======"
          which swift
          swift --version
          echo "========================="
          
          chmod +x flutter/build-android.sh
          bash flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Android-APK
          path: build/flutter-host/Fotufilm.apk
