name: Build Android Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Download Android NDK
        if: always()
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

      - name: Install Halide via APT
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y libhalide17-1-dev
          echo "HALIDE_ROOT=/usr" >> $GITHUB_ENV

      - name: Download and Extract Official Swift SDK
        if: always()
        run: |
          echo "📦 手动下载官方 Swift 6.3.3 Android SDK..."
          wget https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz
          tar -xzf swift-6.3.3-RELEASE_android.artifactbundle.tar.gz
          echo "✅ 下载并解压完成！"

      - name: Build Android APK
        if: always()
        run: |
          echo "🚨🚨🚨 正在运行最终修复版 V11 (自动寻路版) 🚨🚨🚨"
          
          # 自动去 artifactbundle 文件夹里寻找真实的 usr 目录
          SDK_USR_DIR=$(find $GITHUB_WORKSPACE/swift-6.3.3-RELEASE_android.artifactbundle -type d -name "usr" | head -n 1)
          
          if [ -n "$SDK_USR_DIR" ]; then
            echo "✅ 成功探测到真实的 SDK 路径: $SDK_USR_DIR"
            export SWIFT_TOOLCHAIN="$SDK_USR_DIR"
            export SDKROOT="$SDK_USR_DIR"
            export PATH="$SDK_USR_DIR/bin:$PATH"
          else
            echo "❌ 探测失败，强制使用相对路径..."
            export SWIFT_TOOLCHAIN="$GITHUB_WORKSPACE/swift-6.3.3-RELEASE_android.artifactbundle/swift-6.3.3-RELEASE_android/usr"
            export SDKROOT="$SWIFT_TOOLCHAIN"
            export PATH="$SWIFT_TOOLCHAIN/bin:$PATH"
          fi
          
          echo "====== 验证 Swift 工具链 ======"
          which swift
          swift --version
          echo "==============================="
          
          chmod +x flutter/build-android.sh
          ./flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Android-APK
          path: build/flutter-host/Fotufilm.apk
