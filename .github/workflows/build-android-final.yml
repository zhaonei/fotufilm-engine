name: Build Android Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Download Android NDK
        if: always()
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

      - name: Install Halide via APT
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y libhalide17-1-dev
          echo "HALIDE_ROOT=/usr" >> $GITHUB_ENV

      - name: Install Swift SDK for Android
        if: always()
        run: |
          echo "📦 通过官方 swift sdk install 命令安装 Android SDK..."
          swift sdk install https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz --checksum d160cc3206dd1886dae3fef2337af5e25ec034692cd0ec225721c56cc69da7f5

      - name: Build Android APK
        if: always()
        run: |
          echo "🚨🚨🚨 正在运行最终修复版 V9 (锁定官方路径) 🚨🚨🚨"
          
          # 直接用 find 在官方默认安装目录抓取
          SDK_DIR=$(find /home/runner/.swiftpm/swift-sdks -maxdepth 1 -type d -name "swift-*-RELEASE_android.artifactbundle" | head -n 1)
          
          if [ -n "$SDK_DIR" ]; then
            echo "✅ 找到官方 SDK 路径: $SDK_DIR"
            export SWIFT_TOOLCHAIN="$SDK_DIR/usr"
            export SDKROOT="$SDK_DIR/usr"
            export PATH="$SDK_DIR/usr/bin:$PATH"
          else
            echo "❌ 还是没找到，尝试直接用默认名..."
            export SWIFT_TOOLCHAIN="/home/runner/.swiftpm/swift-sdks/swift-6.3.3-RELEASE_android.artifactbundle/usr"
            export SDKROOT="$SWIFT_TOOLCHAIN"
            export PATH="$SWIFT_TOOLCHAIN/bin:$PATH"
          fi
          
          echo "====== 验证 Swift 工具链 ======"
          which swift
          swift --version
          echo "==============================="
          
          chmod +x flutter/build-android.sh
          ./flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Android-APK
          path: build/flutter-host/Fotufilm.apk
