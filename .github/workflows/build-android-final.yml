
name: Build Android Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Download Android NDK
        if: always()
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

      - name: Install Halide via APT
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y libhalide17-1-dev
          echo "HALIDE_ROOT=/usr" >> $GITHUB_ENV

      - name: Download and Extract Official Swift SDK
        if: always()
        run: |
          echo "📦 手动下载官方 Swift 6.3.3 Android SDK..."
          wget https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz
          tar -xzf swift-6.3.3-RELEASE_android.artifactbundle.tar.gz
          echo "✅ 下载并解压完成！"

      - name: Build Android APK
        if: always()
        run: |
          echo "🚨🚨🚨 正在运行最终修复版 V12 (死磕路径版) 🚨🚨🚨"
          
          # 根据上一次的日志，直接硬编码最精确的路径
          export SWIFT_TOOLCHAIN="$GITHUB_WORKSPACE/swift-6.3.3-RELEASE_android.artifactbundle/swift-android/usr"
          export SDKROOT="$SWIFT_TOOLCHAIN"
          export PATH="$SWIFT_TOOLCHAIN/bin:$PATH"
          
          echo "====== 验证 Swift 工具链 ======"
          ls -la $SWIFT_TOOLCHAIN/bin/swift
          which swift
          swift --version
          echo "==============================="
          
          chmod +x flutter/build-android.sh
          ./flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Android-APK
          path: build/flutter-host/Fotufilm.apk
