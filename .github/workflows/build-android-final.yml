
name: Build Android Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Swift Toolchain via Skiptools
        uses: skiptools/swift-android-action@v2
        with:
          android-api-level: 28
          swift-version: '6.3'
          run-tests: false
          build-tests: false
        continue-on-error: true

      - name: Download Android NDK
        if: always()
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

      - name: Install Halide via APT
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y libhalide17-1-dev
          echo "HALIDE_ROOT=/usr" >> $GITHUB_ENV

      - name: Build Android APK
        if: always()
        run: |
          echo "🚨🚨🚨 正在运行最终成功版 V23 (内部写死) 🚨🚨🚨"
          
          # 1. 设定正确的绝对路径
          TOOLCHAIN_DIR="/home/runner/.config/swiftpm/toolchains/swift-6.4.2-RELEASE-android/usr"
          
          # 2. 把环境变量强行插入到 build-android.sh 的第二行（第一行是 #!/bin/bash）
          sed -i '2i export SWIFT_TOOLCHAIN="'$TOOLCHAIN_DIR'"\nexport SDKROOT="'$TOOLCHAIN_DIR'"\nexport PATH="'$TOOLCHAIN_DIR'/bin:$PATH"' flutter/build-android.sh
          
          # 3. 打印出来看看有没有插进去，顺便验证
          echo "====== 检查脚本头部 ======"
          head -n 6 flutter/build-android.sh
          echo "========================="
          
          echo "====== 验证全局工具链 ======"
          export SWIFT_TOOLCHAIN="$TOOLCHAIN_DIR"
          export SDKROOT="$TOOLCHAIN_DIR"
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          which swift
          swift --version
          
          # 4. 加上可执行权限并运行
          chmod +x flutter/build-android.sh
          ./flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Android-APK
          path: build/flutter-host/Fotufilm.apk
