name: Build Android Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Download Android NDK
        if: always()
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

      - name: Install Halide via APT
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y libhalide17-1-dev
          echo "HALIDE_ROOT=/usr" >> $GITHUB_ENV

      - name: Download Official Swift Android SDK
        if: always()
        run: |
          echo "开始下载官方 Swift 6.0.3 Android SDK..."
          # 使用官方带 patch 版本号的正规链接
          wget https://download.swift.org/swift-6.0.3-release/android/swift-6.0.3-RELEASE-android-24-sdk.tar.gz
          tar -xzf swift-6.0.3-RELEASE-android-24-sdk.tar.gz
          mv swift-6.0.3-RELEASE-android-24-sdk swift-android
          echo "✅ SDK 下载并解压完成！"

      - name: Build Android APK
        if: always()
        run: |
          echo "🚨🚨🚨 正在运行最新代码 V7 (修复官方链接) 🚨🚨🚨"
          
          export SWIFT_TOOLCHAIN="$GITHUB_WORKSPACE/swift-android/usr"
          export SDKROOT="$GITHUB_WORKSPACE/swift-android/usr"
          export PATH="$GITHUB_WORKSPACE/swift-android/usr/bin:$PATH"
          
          echo "====== 验证 Swift 工具链 ======"
          ls -la $GITHUB_WORKSPACE/swift-android/usr/bin/swift || echo "找不到 swift 文件！"
          which swift
          swift --version
          
          chmod +x flutter/build-android.sh
          ./flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Android-APK
          path: build/flutter-host/Fotufilm.apk
