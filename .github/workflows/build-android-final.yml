name: Build Android Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Download Android NDK
        if: always()
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

      - name: Install Halide via APT
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y libhalide17-1-dev
          echo "HALIDE_ROOT=/usr" >> $GITHUB_ENV

      - name: Setup Swift Android SDK Manually
        if: always()
        run: |
          # 🌟 直接从 swift.org 官方下载针对 Android 编译的 SDK
          wget https://download.swift.org/swift-6.0.3-release/android/swift-6.0.3-RELEASE-android-24-sdk.tar.gz
          tar -xzf swift-6.0.3-RELEASE-android-24-sdk.tar.gz
          mv swift-6.0.3-RELEASE-android-24-sdk swift-android
          
          # 强行把路径写进环境变量，告诉脚本这就是你要的 Swift
          echo "SWIFT_TOOLCHAIN=$GITHUB_WORKSPACE/swift-android/usr" >> $GITHUB_ENV
          echo "SDKROOT=$GITHUB_WORKSPACE/swift-android/usr" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/swift-android/usr/bin" >> $GITHUB_PATH

      - name: Build Android APK
        if: always()
        run: |
          echo "🚨🚨🚨 正在运行最新代码 V4 (手动安装 SDK) 🚨🚨🚨"
          
          echo "====== 验证当前的 Swift 工具链 ======"
          which swift
          swift --version
          
          # 运行构建
          chmod +x flutter/build-android.sh
          ./flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Android-APK
          path: build/flutter-host/Fotufilm.apk
