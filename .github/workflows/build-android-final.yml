name: Build Android Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. 让官方 Action 安装工具链（忽略它最后的测试报错）
      - name: Setup Swift Toolchain via Skiptools
        uses: skiptools/swift-android-action@v2
        with:
          android-api-level: 28
          swift-version: '6.3'
          run-tests: false
          build-tests: false
        continue-on-error: true

      - name: Download Android NDK
        if: always()
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

      - name: Install Halide via APT
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y libhalide17-1-dev
          echo "HALIDE_ROOT=/usr" >> $GITHUB_ENV

      # 2. 打印真实路径，并传递给构建脚本
      - name: Build Android APK
        if: always()
        run: |
          echo "=== 真实提取的 Swift 路径 ==="
          echo "SWIFT_TOOLCHAIN=$SWIFT_TOOLCHAIN"
          
          if [ -n "$SWIFT_TOOLCHAIN" ]; then
            export PATH="$SWIFT_TOOLCHAIN/usr/bin:$PATH"
            export SDKROOT="$SWIFT_TOOLCHAIN/usr"
            echo "当前 swift 指向："
            which swift
            swift --version
          else
            echo "环境变量为空，直接打印可能存在的目录："
            ls /home/runner/.config/swiftpm/toolchains/ 2>/dev/null || true
          fi

          chmod +x flutter/build-android.sh
          ./flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Android-APK
          path: build/flutter-host/Fotufilm.apk
