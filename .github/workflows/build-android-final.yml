name: Build Android Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Download Android NDK
        if: always()
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

      - name: Install Halide via APT
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y libhalide17-1-dev
          echo "HALIDE_ROOT=/usr" >> $GITHUB_ENV

      # 🌟 核心：手动下载官方 Swift 6.0 Android SDK
      - name: Download Official Swift Android SDK
        if: always()
        run: |
          echo "开始下载官方 Swift 6.0 Android SDK..."
          # 官方稳定版链接，不再依赖第三方 Action
          wget https://download.swift.org/swift-6.0-release/android/swift-6.0-RELEASE-android-24-sdk.tar.gz
          tar -xzf swift-6.0-RELEASE-android-24-sdk.tar.gz
          mv swift-6.0-RELEASE-android-24-sdk swift-android

      - name: Build Android APK
        if: always()
        run: |
          echo "🚨🚨🚨 正在运行最新代码 V6 (纯手动官方 SDK) 🚨🚨🚨"
          
          # 强行指定路径为刚刚解压的官方路径
          export SWIFT_TOOLCHAIN="$GITHUB_WORKSPACE/swift-android/usr"
          export SDKROOT="$GITHUB_WORKSPACE/swift-android/usr"
          export PATH="$GITHUB_WORKSPACE/swift-android/usr/bin:$PATH"
          
          echo "====== 当前使用的 Swift 版本 ======"
          which swift
          swift --version
          echo "==================================="
          
          # 运行构建
          chmod +x flutter/build-android.sh
          ./flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Android-APK
          path: build/flutter-host/Fotufilm.apk
