
name: Build Android Final (Docker)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🌟 核心步骤：直接使用官方维护的 Swift Android Docker 镜像
      - name: Build Android APK in Official Docker Image
        uses: docker://swiftlang/swift-ci:android-6.3.3-RELEASE
        with:
          args: >
            bash -c "
              cd /github/workspace &&
              chmod +x flutter/build-android.sh &&
              ./flutter/build-android.sh
            "
