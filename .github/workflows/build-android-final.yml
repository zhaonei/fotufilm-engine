name: Build Android Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Download Android NDK
        if: always()
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

      - name: Install Halide via APT
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y libhalide17-1-dev
          echo "HALIDE_ROOT=/usr" >> $GITHUB_ENV

      # 🌟 直接用官方链接下载，这个链接在 14:02 的测试中是绝对成功的
      - name: Download Official Swift Android SDK
        if: always()
        run: |
          echo "📦 下载官方 Swift 6.3.3 Android SDK..."
          wget https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz
          tar -xzf swift-6.3.3-RELEASE_android.artifactbundle.tar.gz
          echo "✅ 解压完成！"

      - name: Build Android APK
        if: always()
        run: |
          echo "🚨🚨🚨 正在运行终极成功版 V17 (绝对精准定位) 🚨🚨🚨"
          
          # 在全盘范围内搜索，只找位于 usr/bin 目录下的 swift 可执行文件
          echo "====== 开始精准搜索真正的 Swift 编译器 ======"
          SWIFT_BIN=$(find . -type f -name "swift" -path "*/usr/bin/*" | head -n 1)
          
          if [ -n "$SWIFT_BIN" ]; then
            # 退两级目录，找到包含 usr 的根目录
            TOOLCHAIN_ROOT=$(dirname $(dirname $(dirname $SWIFT_BIN)))
            echo "✅ 找到了！真正的路径是: $TOOLCHAIN_ROOT"
            export SWIFT_TOOLCHAIN="$TOOLCHAIN_ROOT/usr"
            export SDKROOT="$TOOLCHAIN_ROOT/usr"
            export PATH="$TOOLCHAIN_ROOT/usr/bin:$PATH"
          else
            echo "❌ 彻底失败，没有找到 swift 编译器。"
            exit 1
          fi
          
          echo "====== 验证工具链 ======"
          which swift
          swift --version
          echo "========================="
          
          chmod +x flutter/build-android.sh
          bash flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Android-APK
          path: build/flutter-host/Fotufilm.apk
