name: Build Master APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. 安装编译所需的系统依赖库
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils git gnupg2 libc6-dev libcurl4-openssl-dev libedit2 \
            libgcc-9-dev libpython3.8 libsqlite3-0 libstdc++-9-dev libxml2-dev \
            libz3-dev pkg-config tzdata zlib1g-dev \
            cmake make g++ automake autoconf libtool \
            libhalide17-1-dev
          echo "HALIDE_ROOT=/usr" >> $GITHUB_ENV

      # 2. 注入网络重试补丁，防止编译底层库时下载断连
      - name: Inject Network Retry Patch
        run: |
          sudo mv /usr/bin/curl /usr/bin/curl-original
          sudo tee /usr/bin/curl > /dev/null << 'EOF'
          #!/bin/bash
          /usr/bin/curl-original --retry 5 --retry-delay 3 --retry-all-errors "$@"
          EOF
          sudo chmod +x /usr/bin/curl

          sudo mv /usr/bin/wget /usr/bin/wget-original
          sudo tee /usr/bin/wget > /dev/null << 'EOF'
          #!/bin/bash
          /usr/bin/wget-original --tries=5 --timeout=30 --waitretry=3 "$@"
          EOF
          sudo chmod +x /usr/bin/wget

      - name: Download Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

      # 3. 下载 Ubuntu 宿主机 Swift 工具链
      - name: Download Swift Host Toolchain
        run: |
          wget https://download.swift.org/swift-6.3.3-release/ubuntu2204/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu22.04.tar.gz
          tar -xzf swift-6.3.3-RELEASE-ubuntu22.04.tar.gz
          mv swift-6.3.3-RELEASE-ubuntu22.04 swift-host

      # 4. 下载 Android 目标 SDK
      - name: Download Swift Android SDK
        run: |
          wget https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz
          tar -xzf swift-6.3.3-RELEASE_android.artifactbundle.tar.gz

      # 5. 执行构建
      - name: Build Android APK
        run: |
          chmod +x flutter/build-android.sh
          ./flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Android-APK
          path: build/flutter-host/Fotufilm.apk
