name: Build Fotufilm Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. 安装 Swiftly 并设定精确的宿主机 Swift 版本
      - name: Install Swift Host Toolchain
        run: |
          curl -O https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz
          tar zxf swiftly-*.tar.gz
          ./swiftly init --quiet-shell-followup --assume-yes
          swiftly install 6.3.3
          swiftly use 6.3.3 --global-default
          # 将 swiftly 路径加入环境变量
          echo "$HOME/.local/share/swiftly/bin" >> $GITHUB_PATH
          echo "$HOME/.local/share/swiftly/toolchains/6.3.3/usr/bin" >> $GITHUB_PATH

      # 2. 安装 Android NDK
      - name: Install Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

      # 3. 手动交叉编译 Halide (这是之前失败的核心，必须从源码编译为 Android 版本)
      - name: Build Halide for Android
        run: |
          # 安装编译 Halide 所需的系统依赖
          sudo apt-get update
          sudo apt-get install -y \
            cmake make g++ llvm-17-dev libclang-17-dev \
            libedit-dev libxml2-dev zlib1g-dev
          # 下载 Halide 源码
          wget https://github.com/halide/Halide/archive/refs/tags/v17.0.1.tar.gz
          tar -xzf v17.0.1.tar.gz
          cd Halide-17.0.1
          # 创建独立构建目录
          mkdir build-android && cd build-android
          # 核心：使用 CMake 交叉编译 Halide 静态库，目标为 Android ARM64
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/android-ndk-r26d/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DHalide_SHARED_LLVM=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DHalide_TARGET=arm-64-android \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/halide-android"
          make -j$(nproc)
          make install
          # 将编译好的 Halide 路径写入环境变量
          echo "HALIDE_ROOT=$GITHUB_WORKSPACE/halide-android" >> $GITHUB_ENV

      # 4. 安装 Swift Android SDK (用于 Swift 交叉编译)
      - name: Install Swift Android SDK
        run: |
          # 使用 finagolfin 提供的社区 SDK 包
          wget https://github.com/finagolfin/swift-android-sdk/releases/download/6.3.3/swift-6.3.3-RELEASE-android-24-0.1.artifactbundle.tar.gz
          # 使用官方推荐的 swift sdk install 命令安装
          swift sdk install swift-6.3.3-RELEASE-android-24-0.1.artifactbundle.tar.gz
          swift sdk list

      # 5. 规避 GitHub Runner 环境变量冲突
      - name: Clean Android Env
        run: |
          unset ANDROID_NDK_ROOT
          unset ANDROID_NDK_HOME

      # 6. 执行最终构建
      - name: Build APK
        run: |
          # 确保 PATH 顺序正确
          export PATH="$HOME/.local/share/swiftly/toolchains/6.3.3/usr/bin:$PATH"
          # 执行项目自带的构建脚本
          chmod +x flutter/build-android.sh
          ./flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Android-APK
          path: build/flutter-host/Fotufilm.apk
