name: Build Android New

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install ALL System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config git gnupg2 \
            llvm-17-dev libclang-17-dev lld-17 liblld-17-dev clang-17 \
            libedit-dev libz3-dev libffi-dev libncurses5-dev libncursesw5-dev \
            zlib1g-dev libzstd-dev liblz4-dev libbz2-dev liblzma-dev \
            libjpeg-dev libpng-dev libtiff-dev libwebp-dev \
            libxml2-dev libexpat1-dev libssl-dev libcurl4-openssl-dev \
            libpython3-dev python3-dev swig automake autoconf libtool

      - name: Install Swift 6.3.3
        run: |
          curl -O https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz
          tar zxf swiftly-*.tar.gz
          ./swiftly init --quiet-shell-followup --assume-yes
          export PATH="$HOME/.local/share/swiftly/bin:$PATH"
          echo "$HOME/.local/share/swiftly/bin" >> $GITHUB_PATH
          swiftly install 6.3.3
          swiftly use 6.3.3 --global-default
          echo "$HOME/.local/share/swiftly/toolchains/6.3.3/usr/bin" >> $GITHUB_PATH

      - name: Setup NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          # 这里不能 unset，因为原版脚本需要读 ANDROID_NDK_HOME
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

      - name: Install Swift Android SDK
        run: |
          wget https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz
          swift sdk install swift-6.3.3-RELEASE_android.artifactbundle.tar.gz

      - name: Build Halide for Android
        run: |
          wget https://github.com/halide/Halide/archive/refs/tags/v17.0.1.tar.gz
          tar -xzf v17.0.1.tar.gz
          cd Halide-17.0.1 && mkdir build-android && cd build-android
          
          LLVM_DIR=$(llvm-config-17 --cmakedir)
          CLANG_DIR="/usr/lib/llvm-17/lib/cmake/clang"
          LLD_DIR="/usr/lib/llvm-17/lib/cmake/lld"
          
          cmake .. \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/android-ndk-r26d/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DHalide_TARGET=arm-64-android \
            -DLLVM_DIR="$LLVM_DIR" \
            -DClang_DIR="$CLANG_DIR" \
            -DLLD_DIR="$LLD_DIR" \
            -DHalide_SHARED_LLVM=YES \
            -DTARGET_WEBASSEMBLY=OFF \
            -DWITH_PYTHON_BINDINGS=OFF \
            -DWITH_TUTORIALS=OFF \
            -DTARGET_CUDA=OFF \
            -DTARGET_OPENCL=OFF \
            -DTARGET_VULKAN=ON \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/halide-android"
            
          ninja && ninja install
          # 注意：原版脚本里 KERNELS 变量找的是 build/halide-android-arm64
          # 我们把编译结果软链接过去，让脚本能找得到
          mkdir -p $GITHUB_WORKSPACE/build
          ln -s $GITHUB_WORKSPACE/halide-android $GITHUB_WORKSPACE/build/halide-android-arm64
          echo "HALIDE_ROOT=$GITHUB_WORKSPACE/halide-android" >> $GITHUB_ENV

      - name: Build APK
        run: |
          # 将变量写入 GitHub 环境，供 build-android.sh 使用
          echo "SWIFT_TOOLCHAIN=$HOME/.local/share/swiftly/toolchains/6.3.3/usr" >> $GITHUB_ENV
          echo "SWIFT_SDK=swift-6.3.3-RELEASE_android" >> $GITHUB_ENV
          
          chmod +x flutter/build-android.sh
          ./flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Android-APK
          path: build/flutter-host/Fotufilm.apk

