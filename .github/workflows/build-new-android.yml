name: Build Android New

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 🌟 修复 1：补齐 Halide 缺失的开发库（libedit-dev, libzstd-dev 等）
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils git gnupg2 libc6-dev libcurl4-openssl-dev libedit-dev \
            libgcc-9-dev libpython3.8 libsqlite3-0 libstdc++-9-dev libxml2-dev \
            libz3-dev pkg-config tzdata zlib1g-dev libzstd-dev \
            cmake make g++ automake autoconf libtool \
            llvm-17-dev libclang-17-dev libffi-dev libncurses-dev

      - name: Install Swift 6.3.3
        run: |
          curl -O https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz
          tar zxf swiftly-*.tar.gz
          ./swiftly init --quiet-shell-followup --assume-yes
          export PATH="$HOME/.local/share/swiftly/bin:$PATH"
          echo "$HOME/.local/share/swiftly/bin" >> $GITHUB_PATH
          swiftly install 6.3.3
          swiftly use 6.3.3 --global-default
          echo "$HOME/.local/share/swiftly/toolchains/6.3.3/usr/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/share/swiftly/toolchains/6.3.3/usr/bin:$PATH"
          which swift && swift --version

      - name: Setup NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          unset ANDROID_NDK_ROOT
          unset ANDROID_NDK_HOME

      - name: Install Swift Android SDK
        run: |
          wget https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz
          swift sdk install swift-6.3.3-RELEASE_android.artifactbundle.tar.gz
          swift sdk list

      # 🌟 修复 2：显式指定 Clang_DIR 和 LLVM_DIR
      - name: Build Halide for Android
        run: |
          wget https://github.com/halide/Halide/archive/refs/tags/v17.0.1.tar.gz
          tar -xzf v17.0.1.tar.gz
          cd Halide-17.0.1 && mkdir build-android && cd build-android
          
          LLVM_DIR=$(llvm-config-17 --cmakedir)
          CLANG_DIR="/usr/lib/llvm-17/lib/cmake/clang"
          
          echo "Found LLVM_DIR: $LLVM_DIR"
          echo "Using CLANG_DIR: $CLANG_DIR"
          
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/android-ndk-r26d/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DHalide_TARGET=arm-64-android \
            -DLLVM_DIR="$LLVM_DIR" \
            -DClang_DIR="$CLANG_DIR" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/halide-android"
            
          make -j$(nproc) && make install
          echo "HALIDE_ROOT=$GITHUB_WORKSPACE/halide-android" >> $GITHUB_ENV

      - name: Build APK
        run: |
          export PATH="$HOME/.local/share/swiftly/toolchains/6.3.3/usr/bin:$PATH"
          export SWIFT_TOOLCHAIN="$HOME/.local/share/swiftly/toolchains/6.3.3/usr"
          
          chmod +x flutter/build-android.sh
          ./flutter/build-android.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fotufilm-Android-APK
          path: build/flutter-host/Fotufilm.apk
